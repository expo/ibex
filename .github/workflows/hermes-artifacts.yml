      - name: Validate Linux raw handoff bytes
        if: needs.release_state.outputs.need_linux == 'true'
        env:
          EXPECTED_NAME: ${{ needs.linux.outputs.asset_name }}
          EXPECTED_ROLE: linux
          EXPECTED_SHA256: ${{ needs.linux.outputs.asset_sha256 }}
          EXPECTED_SIZE: ${{ needs.linux.outputs.asset_size }}
          HANDOFF_DIR: ${{ runner.temp }}/ibex-hermes-publish/linux
          IBEX_PUBLISH_ROOT: ${{ runner.temp }}/ibex-hermes-publish
        run: python3 -c "$IBEX_PUBLISH_HANDOFF_VALIDATOR"

      - name: Download macOS Release direct handoff without decompression
        if: needs.release_state.outputs.need_macos_release_legacy == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.macos_release.outputs.legacy_artifact_id }}
          path: ${{ runner.temp }}/ibex-hermes-publish/macos-release
          skip-decompress: true
          digest-mismatch: error

      - name: Validate macOS Release raw handoff bytes
        if: needs.release_state.outputs.need_macos_release_legacy == 'true'
        env:
          EXPECTED_NAME: ${{ needs.macos_release.outputs.legacy_asset_name }}
          EXPECTED_ROLE: macos-release
          EXPECTED_SHA256: ${{ needs.macos_release.outputs.legacy_asset_sha256 }}
