# cargo-audit configuration for the CI Preflight gate
# (.github/workflows/ci.yml runs `cargo audit --deny warnings`).

[advisories]
# RUSTSEC-2026-0249: `smartstring` is unmaintained (informational, no
# vulnerability). It reaches this workspace only through the vendored swc
