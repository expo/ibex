[package]
name = "ibex2"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

# Deliberately dependency-free, and deliberately not linked to an engine yet.
# The grant model below is pure Rust and testable today; the engine adapter
# arrives with the spike, behind a feature, so the workspace stays green on a
# machine that has not built vanilla Hermes.
[dependencies]
# LLP 0059.000 §3.4: a partial URL parser is a security bug rather than a
# missing feature, so URL is a well-tested crate and not hand-written.
base64 = "0.22"
form_urlencoded = "1.2"
url = "2.5"

[build-dependencies]
cc = "1"

[features]
default = []
# Link the spike against vanilla Hermes from ios/Frameworks-vanilla/.
# Off by default so the workspace builds without an engine present.
hermes = []
