name: Module loader baselines

# @ref LLP 0026#phase-0-baseline-the-current-contract — collect native,
# fail-loud loader-path evidence where this repository publishes patched
# Hermes runtime artifacts. LLP 0001 keeps Windows visible as a missing full
# runtime row rather than pretending its staging-only CI is execution parity.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/module-loader-baselines.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "build.rs"
      - "rust-toolchain.toml"
      - "config/module-transform.json"
      - "issues/20260717-oxc-dual-produce-report.md"
      - "llp/0001-target-platforms-and-ci-matrix.rfc.md"
      - "llp/0002-host-embedding-abi.spec.md"
      - "llp/0003-hermes-engine-bridge.explainer.md"
      - "llp/0019-hermes-compat-transform-authority.decision.md"
      - "llp/0026-esm-module-runner.rfc.md"
      - "llp/0027-module-artifact-and-interop.spec.md"
      - "llp/0029-single-file-executable-packaging.rfc.md"
      - "llp/0047-standalone-executable-finish-line.plan.md"
      - "packages/ibex-devtools/src/scripts/benchmark-module-loader-baseline.mjs"
      - "packages/ibex-devtools/src/scripts/benchmark-sfe-release.mjs"
      - "packages/ibex-devtools/src/scripts/check-module-runner-performance.mjs"
      - "packages/ibex-devtools/src/scripts/check-module-runner-performance.test.mjs"
      - "packages/ibex-devtools/src/scripts/collect-module-loader-baseline.mjs"
      - "packages/ibex-devtools/src/scripts/hermes-compat-corpus.mjs"
      - "packages/ibex-devtools/src/scripts/module-runner-shadow.test.mjs"
      - "packages/ibex-devtools/src/scripts/run-native-tier3-conformance.mjs"
      - "packages/ibex-devtools/src/scripts/legacy-required-telemetry.mjs"
      - "packages/ibex-devtools/src/scripts/legacy-required-telemetry.test.mjs"
      - "packages/ibex-devtools/src/scripts/run-module-semantics-native.mjs"
      - "packages/ibex-devtools/src/scripts/oxc-dual-produce-report.mjs"
      - "packages/ibex-devtools/src/scripts/oxc-dual-produce-report.test.mjs"
      - "packages/ibex-devtools/src/scripts/sfe-performance.mjs"
      - "packages/ibex-devtools/src/scripts/sfe-performance.test.mjs"
      - "packages/ibex-devtools/src/scripts/transforms.mjs"
      - "config/llp0019-hermes-target-matrix.json"
      - "config/llp0019-native-tier3-corpus.json"
      - "include/exact_runtime.h"
      - "src/compiled_contract.rs"
      - "src/bin/ibex/sfe.rs"
      - "src/bin/ibex_sfe_contract.rs"
      - "src/engine/hermes_module_runner.cc"
      - "src/engine/hermes_runtime_internal.h"
      - "src/module_loader/**"
      - "crates/compiled-stub/**"
      - "crates/sfe-catalog/**"
      - "crates/sfe-format/**"
      - "scripts/check-sfe-foundation.sh"
      - "scripts/build-sfe-release.sh"
      - "scripts/check-sfe-release-kit.sh"
      - "scripts/check-sfe-reproducibility.sh"
      - "scripts/run-oxc-dual-produce-report.sh"
      - "tests/fixtures/sfe-release/**"
      - "tests/module_runner_spike.rs"
      - "tests/module_semantics_native.rs"
      - "tests/native_tier3_conformance.rs"
      - "tests/fixtures/module-runner-spike/**"
      - "tests/fixtures/module-semantics/**"

permissions:
  contents: read

concurrency:
  group: module-loader-baselines-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-runner:
    name: native-runner-${{ matrix.platform }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: darwin
            arch: arm64
          - os: ubuntu-latest
            platform: linux
            arch: x64
          - os: windows-2022
            platform: win32
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        shell: bash
        run: scripts/install-rust-toolchain.sh

      - name: Configure MSVC developer environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Node compatibility target
        if: runner.os != 'Windows'
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.1

      - name: Install Bun
        if: runner.os != 'Windows'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install JavaScript dependencies
        if: runner.os != 'Windows'
        run: bun install --frozen-lockfile

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev pkg-config

      # This bundle supplies the JSI headers, link library, and Hermes CLI from
      # one patch identity. Mixing React Native headers with another framework
      # is not admissible evidence for the native record ABI.
      - name: Install matching patched Hermes toolchain
        if: runner.os != 'Windows'
        run: ./scripts/download-hermes.sh

      - name: Install Windows Hermes toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/install-windows-hermes.ps1

      - name: Install Windows OpenSSL build Perl
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install strawberryperl --yes --no-progress
          "C:\Strawberry\perl\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Check module-runner build feature matrix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cargo check --all-targets
          cargo check --all-targets --no-default-features

      # Keep the executable format/catalog/stub interface and the real fixed
      # hermesc recipe in one required gate on both v1 host tuples.
      # @ref LLP 0047#3-milestone-0--restore-a-green-foundation
      - name: Check standalone-executable foundation
        if: runner.os != 'Windows'
        shell: bash
        run: scripts/check-sfe-foundation.sh

      # Git Bash prepends its own /usr/bin/link.exe ahead of the MSVC linker.
      # Keep Windows Rust invocations in the developer-command environment
      # established above so rustc resolves the intended Visual Studio tool.
      - name: Check module-runner build feature matrix (Windows MSVC)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $linker = (Get-Command link.exe -CommandType Application -ErrorAction Stop).Source
          if (-not $linker.StartsWith($env:VCToolsInstallDir, [System.StringComparison]::OrdinalIgnoreCase)) {
            throw "Rust linker is outside the activated MSVC toolchain: $linker"
          }
          perl -MLocale::Maketext::Simple -e 1
          if ($LASTEXITCODE -ne 0) { throw "Strawberry Perl compatibility probe failed" }
          cargo check --all-targets
          if ($LASTEXITCODE -ne 0) { throw "default-feature Cargo check failed" }
          cargo check --all-targets --no-default-features
          if ($LASTEXITCODE -ne 0) { throw "no-default-feature Cargo check failed" }

      - name: Run advertised native ESM and CommonJS record corpus
        if: runner.os != 'Windows'
        shell: bash
        run: |
          scripts/run-tests.sh --scope lib --features module-runner \
            engine::module_runner::tests::oxc_javascript_goal_output_is_accepted_by_loaded_hermes \
            -- --exact --test-threads=1
          scripts/run-tests.sh --scope lib --features module-runner \
            engine::module_runner::tests -- --test-threads=1
          scripts/run-tests.sh --scope lib \
            --features module-runner,capsec-conformance-observer \
            engine::module_runner::tests::source_prepared_and_hbc_factories_have_frame_principal_attribution \
            -- --exact --test-threads=1
          scripts/run-tests.sh --scope lib --features module-runner \
            module_loader::graph::tests
          scripts/run-tests.sh --scope lib --features module-runner \
            host::tests::authenticated_source_graph_round_trips_through_prepared_cache \
            -- --test-threads=1

      - name: Run native Tier-3 source and prepared receipt corpus
        if: runner.os != 'Windows'
        shell: bash
        env:
          IBEX_LEGACY_REQUIRED_TELEMETRY_OUTPUT: ${{ runner.temp }}/legacy-required-telemetry-${{ matrix.platform }}-${{ matrix.arch }}.json
        run: |
          node --test packages/ibex-devtools/src/scripts/legacy-required-telemetry.test.mjs
          cargo test --test native_tier3_conformance \
            --features module-runner,capsec-conformance-observer \
            -- --nocapture --test-threads=1

      - name: Upload controlled LegacyRequired telemetry
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: legacy-required-telemetry-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/legacy-required-telemetry-${{ matrix.platform }}-${{ matrix.arch }}.json
          if-no-files-found: error
          retention-days: 30

      - name: Run native behavioral transform source and prepared corpus
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cargo test --test module_semantics_native \
            --features module-runner,capsec-conformance-observer \
            -- --nocapture --test-threads=1

      - name: Verify Windows native linkage and explicit unadvertised target
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:Path = "C:\Strawberry\perl\bin;$env:Path"
          $env:IBEX_FAIL_ON_STALE_VENDORED = "1"
          cargo test --lib --features module-runner module_loader::graph::tests
          if ($LASTEXITCODE -ne 0) { throw "Windows module graph tests failed" }
          cargo test --bin ibex --features module-runner runtime::tests::native_module_runner_has_a_nonempty_exact_target_advertisement -- --exact
          if ($LASTEXITCODE -ne 0) { throw "Windows unadvertised-target test failed" }

      - name: Run canonical and Test262 producer corpus on Hermes
        if: runner.os == 'macOS'
        run: scripts/run-tests.sh --test module_runner_spike --features module-runner-spike

  sfe-release-kit:
    name: sfe-release-kit-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.replica }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: darwin
            arch: arm64
            replica: a
            target: aarch64-apple-darwin
            minimum_platform: macos-14.0-arm64
          - os: macos-14
            platform: darwin
            arch: arm64
            replica: b
            target: aarch64-apple-darwin
            minimum_platform: macos-14.0-arm64
          # The catalog contract promises glibc 2.35, so this row deliberately
          # uses Ubuntu 22.04 rather than ubuntu-latest.
          # @ref LLP 0031#decision
          - os: ubuntu-22.04
            platform: linux
            arch: x64
            replica: a
            target: x86_64-unknown-linux-gnu
            minimum_platform: linux-glibc-2.35-x86-64-v1
          - os: ubuntu-22.04
            platform: linux
            arch: x64
            replica: b
            target: x86_64-unknown-linux-gnu
            minimum_platform: linux-glibc-2.35-x86-64-v1
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        shell: bash
        run: scripts/install-rust-toolchain.sh

      - name: Install pinned policy-authoring runner
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install policy-authoring dependencies
        shell: bash
        run: bun install --frozen-lockfile

      - name: Install Linux static-link dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libicu-dev pkg-config zlib1g-dev

      - name: Install matching patched Hermes toolchain
        shell: bash
        run: ./scripts/download-hermes.sh

      - name: Build catalog-pinned release kit
        shell: bash
        env:
          HERMES_LINK_STATIC: "1"
          HERMES_STATIC_LIB_NAME: hermesvm_a
        run: |
          set -euo pipefail
          kit="$RUNNER_TEMP/ibex-sfe-release-kit"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            scripts/build-sfe-release.sh \
              --target "${{ matrix.target }}" \
              --minimum-platform "${{ matrix.minimum_platform }}" \
              --engine-profile hermes-release-static-v1 \
              --hermesc tools/hermes/hermesc-macos-arm64 \
              --hermes tools/hermes/hermes \
              --policy-runner "$(command -v bun)" \
              --static-archive hermesvm ios/Frameworks/macos-static/libhermesvm_a.a \
              --static-archive jsi ios/Frameworks/macos-static/libjsi.a \
              --static-archive boost-context ios/Frameworks/macos-static/libboost_context.a \
              --output "$kit" \
              --release "ibex-ci-$GITHUB_SHA" \
              --sequence 1
          else
            icu_lib_dir="$(pkg-config --variable=libdir icu-i18n)"
            scripts/build-sfe-release.sh \
              --target "${{ matrix.target }}" \
              --minimum-platform "${{ matrix.minimum_platform }}" \
              --engine-profile hermes-release-static-v1 \
              --hermesc tools/hermes/hermesc-linux-x64 \
              --hermes tools/hermes/hermes-linux-x64 \
              --policy-runner "$(command -v bun)" \
              --static-archive hermesvm linux/lib/libhermesvm_a.a \
              --static-archive jsi linux/lib/libjsi.a \
              --static-archive boost-context linux/lib/libboost_context.a \
              --static-archive icu-i18n "$icu_lib_dir/libicui18n.a" \
              --static-archive icu-uc "$icu_lib_dir/libicuuc.a" \
              --static-archive icu-data "$icu_lib_dir/libicudata.a" \
              --output "$kit" \
              --release "ibex-ci-$GITHUB_SHA" \
              --sequence 1
          fi

      - name: Exercise installed-user standalone flow
        shell: bash
        env:
          SFE_BUILDER_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.replica }}
        run: |
          scripts/check-sfe-release-kit.sh \
            "$RUNNER_TEMP/ibex-sfe-release-kit" \
            --evidence-output "$RUNNER_TEMP/sfe-repro-evidence"

      - name: Record release-kit identities
        shell: bash
        run: |
          set -euo pipefail
          kit="$RUNNER_TEMP/ibex-sfe-release-kit"
          policy_toolchains=("$kit"/ibex-policy-toolchain-*)
          [[ ${#policy_toolchains[@]} -eq 1 && -d "${policy_toolchains[0]}" ]]
          shasum -a 256 \
            "$kit/ibex" \
            "$kit/ibex-sfe-catalog" \
            "$kit"/*.tar.gz \
            "$kit/policy-toolchain-report.json" \
            "${policy_toolchains[0]}/manifest.json" \
            "${policy_toolchains[0]}/bin/bun" \
            > "$kit/release-kit.sha256"
          cat "$kit/release-kit.sha256"

      - name: Upload standalone release receipts
        uses: actions/upload-artifact@v4
        with:
          name: sfe-release-receipts-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.replica }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/ibex-sfe-release-kit/*.json
            ${{ runner.temp }}/ibex-sfe-release-kit/ibex-policy-toolchain-*/manifest.json
            ${{ runner.temp }}/ibex-sfe-release-kit/release-kit.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload clean-builder reproducibility evidence
        uses: actions/upload-artifact@v4
        with:
          name: sfe-repro-evidence-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.replica }}-${{ github.sha }}
          path: ${{ runner.temp }}/sfe-repro-evidence
          if-no-files-found: error
          retention-days: 30

  sfe-reproducibility:
    name: sfe-two-clean-builder-reproducibility
    needs: [sfe-release-kit]
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download macOS builder A evidence
        uses: actions/download-artifact@v4
        with:
          name: sfe-repro-evidence-darwin-arm64-a-${{ github.sha }}
          path: ${{ runner.temp }}/evidence/darwin-a

      - name: Download macOS builder B evidence
        uses: actions/download-artifact@v4
        with:
          name: sfe-repro-evidence-darwin-arm64-b-${{ github.sha }}
          path: ${{ runner.temp }}/evidence/darwin-b

      - name: Download Linux builder A evidence
        uses: actions/download-artifact@v4
        with:
          name: sfe-repro-evidence-linux-x64-a-${{ github.sha }}
          path: ${{ runner.temp }}/evidence/linux-a

      - name: Download Linux builder B evidence
        uses: actions/download-artifact@v4
        with:
          name: sfe-repro-evidence-linux-x64-b-${{ github.sha }}
          path: ${{ runner.temp }}/evidence/linux-b

      - name: Compare exact unsigned application identities
        shell: bash
        run: |
          set -euo pipefail
          reports="$RUNNER_TEMP/reproducibility-reports"
          mkdir "$reports"
          scripts/check-sfe-reproducibility.sh \
            --target aarch64-apple-darwin \
            --left "$RUNNER_TEMP/evidence/darwin-a" \
            --right "$RUNNER_TEMP/evidence/darwin-b" \
            --output "$reports/aarch64-apple-darwin.json"
          scripts/check-sfe-reproducibility.sh \
            --target x86_64-unknown-linux-gnu \
            --left "$RUNNER_TEMP/evidence/linux-a" \
            --right "$RUNNER_TEMP/evidence/linux-b" \
            --output "$reports/x86_64-unknown-linux-gnu.json"

      - name: Upload two-builder reproducibility reports
        uses: actions/upload-artifact@v4
        with:
          name: sfe-reproducibility-reports-${{ github.sha }}
          path: ${{ runner.temp }}/reproducibility-reports
          if-no-files-found: error
          retention-days: 30

  oxc-dual-produce:
    name: Oxc 0.121/0.140 dual-produce evidence
    runs-on: macos-14
    timeout-minutes: 120

    steps:
      - name: Check out repository with pre-rotation history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install current and pre-rotation Rust toolchains
        shell: bash
        run: |
          scripts/install-rust-toolchain.sh
          rustup toolchain install 1.93.1 --profile minimal

      - name: Install Node compatibility target
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.1

      - name: Install matching patched Hermes toolchain
        run: ./scripts/download-hermes.sh

      - name: Test the precommitted projection and map decoder
        run: node --test packages/ibex-devtools/src/scripts/oxc-dual-produce-report.test.mjs

      # The old producer is rebuilt in a detached worktree with its own
      # lockfile. Each complete bundle is then run independently on the same
      # real Hermes binary; production never loads both producers or bundles.
      # @ref LLP 0028#1-toolchain-and-pin-rotation--atomic-with-identity-rotation
      - name: Produce and compare old/new artifacts
        run: scripts/run-oxc-dual-produce-report.sh "$RUNNER_TEMP/oxc-dual-produce-evidence"

      - name: Upload content-addressed comparison report
        uses: actions/upload-artifact@v4
        with:
          name: oxc-dual-produce-${{ github.sha }}
          path: ${{ runner.temp }}/oxc-dual-produce-evidence/*.json
          if-no-files-found: error
          retention-days: 30

  collect:
    name: ${{ matrix.report }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            report: performance-macos-arm64
            platform: darwin
            arch: arm64
          - os: ubuntu-latest
            report: performance-linux-x64
            platform: linux
            arch: x64
          - os: windows-2022
            report: performance-windows-x64
            platform: win32
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        shell: bash
        run: scripts/install-rust-toolchain.sh

      - name: Configure MSVC developer environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Node compatibility target
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.1

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev pkg-config

      - name: Install patched Hermes artifacts
        if: runner.os != 'Windows'
        run: ./scripts/download-hermes.sh

      - name: Install Windows Hermes artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/install-windows-hermes.ps1

      - name: Install Windows OpenSSL build Perl
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install strawberryperl --yes --no-progress
          "C:\Strawberry\perl\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install JavaScript toolchain
        run: bun install --frozen-lockfile

      - name: Shadow authenticated graph shape against the legacy scanner
        run: node --test packages/ibex-devtools/src/scripts/module-runner-shadow.test.mjs

      - name: Collect fail-loud clean-build and loader baseline
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            export PATH="/c/Strawberry/perl/bin:$PATH"
            perl -MLocale::Maketext::Simple -e 1
            node -e 'require("node:fs").writeFileSync(process.argv[1], JSON.stringify({schema:"ibex/module-runner-unavailability/1",platform:{os:"windows",arch:"x86_64"},status:"unadvertised",reason:"The published Windows Hermes package lacks the patched native module evaluator and compartment binder; the bounded compatibility loader remains active."}, null, 2) + "\n")' \
              "$RUNNER_TEMP/native-${{ matrix.report }}.json"
            for report in \
              "${{ matrix.report }}.json" \
              "default-${{ matrix.report }}.json" \
              "micro-${{ matrix.report }}.json"; do
              cp "$RUNNER_TEMP/native-${{ matrix.report }}.json" "$RUNNER_TEMP/$report"
            done
          else
            node packages/ibex-devtools/src/scripts/collect-module-loader-baseline.mjs \
              --samples 5 \
              --no-default-features \
              --target-dir "$RUNNER_TEMP/module-loader-target" \
              --expect-os "${{ matrix.platform }}" \
              --expect-arch "${{ matrix.arch }}" \
              --write "$RUNNER_TEMP/${{ matrix.report }}.json"

            node packages/ibex-devtools/src/scripts/collect-module-loader-baseline.mjs \
              --samples 5 \
              --target-dir "$RUNNER_TEMP/module-loader-default-target" \
              --expect-os "${{ matrix.platform }}" \
              --expect-arch "${{ matrix.arch }}" \
              --write "$RUNNER_TEMP/default-${{ matrix.report }}.json"

            IBEX_MODULE_RUNNER_PERF_OUTPUT="$RUNNER_TEMP/native-${{ matrix.report }}.json" \
            IBEX_MODULE_RUNNER_PERF_SAMPLES=5 \
            CARGO_TARGET_DIR="$RUNNER_TEMP/module-loader-default-target" \
              cargo test --release --lib \
                host::tests::module_runner_performance_baseline -- \
                --ignored --exact --nocapture

            IBEX_MODULE_RUNNER_MICRO_PERF_OUTPUT="$RUNNER_TEMP/micro-${{ matrix.report }}.json" \
            IBEX_MODULE_RUNNER_PERF_SAMPLES=5 \
            CARGO_TARGET_DIR="$RUNNER_TEMP/module-loader-default-target" \
              cargo test --release --lib \
                engine::module_runner::tests::module_runner_cell_and_require_performance_baseline -- \
                --ignored --exact --nocapture
          fi

          node packages/ibex-devtools/src/scripts/check-module-runner-performance.mjs \
            --legacy "$RUNNER_TEMP/${{ matrix.report }}.json" \
            --current "$RUNNER_TEMP/default-${{ matrix.report }}.json" \
            --native "$RUNNER_TEMP/native-${{ matrix.report }}.json" \
            --micro "$RUNNER_TEMP/micro-${{ matrix.report }}.json" \
            --write "$RUNNER_TEMP/gate-${{ matrix.report }}.json"

      - name: Upload baseline evidence
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.report }}
          path: |
            ${{ runner.temp }}/${{ matrix.report }}.json
            ${{ runner.temp }}/default-${{ matrix.report }}.json
            ${{ runner.temp }}/native-${{ matrix.report }}.json
            ${{ runner.temp }}/micro-${{ matrix.report }}.json
