[package]
name = "ibex-compiled-stub"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
build = "build.rs"

[dependencies]
anyhow = "1"
capsec-semantics = { path = "../capsec-semantics" }
ibex-runtime = { path = "../..", features = ["sfe-compiled-runtime", "sfe-static-network"] }
ibex-sfe-format = { path = "../sfe-format" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
capsec-semantics = { path = "../capsec-semantics" }
cc = "1"
ibex-sfe-format = { path = "../sfe-format" }
serde_json = "1"
