# @ref LLP 0021#wp10--prove-targets-and-publish-the-conformance-report — run the
# complete documented prerequisite matrix against one exact patched engine and
# retain its artifacts. Until every obligation is executable, CI must prove the
# candidate is incomplete and unadvertised rather than synthesizing promotion.
name: CapSec full matrix and evidence

on:
  workflow_dispatch:
    inputs:
      target:
        description: Physical target to execute
        required: true
        default: both
        type: choice
        options:
          - both
          - macos
          - windows
      scope:
        description: Evidence scope (focused repair or complete matrix)
        required: true
        default: full
        type: choice
        options:
          - full
          - startup
          - module-semantics
          - dns
          - target-absence
          - fs-queue
  schedule:
    # Weekly, Monday 08:00 UTC (after the patch canary).
    - cron: "0 8 * * 1"
  pull_request:
  push:
    branches:
      - main

concurrency:
  # Manual target-only probes must not cancel a retained full-matrix run for
  # the same ref. Automatic runs have no input and therefore share `both`.
  group: capsec-full-matrix-${{ github.ref }}-${{ inputs.target || 'both' }}-${{ inputs.scope || 'full' }}
  cancel-in-progress: true

jobs:
  conformance:
    name: Complete matrix + unadvertised evidence (macOS arm64)
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.scope == 'full' && (inputs.target == 'both' || inputs.target == 'macos')) }}
    runs-on: macos-14
    timeout-minutes: 180
    env:
      # download-hermes.sh defaults to the developer/debug profile. This job
      # proves the physical Release target, so bind both artifact selection and
      # the C++ wrapper compile to the no-debugger profile explicitly.
      HERMES_ENABLE_DEBUGGER: "false"
    steps:
      - name: Check out Ibex
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.93.1 --profile minimal
          rustup default 1.93.1

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install Node compatibility oracle
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.1

      - name: Bind exact Node compatibility oracle
        run: echo "IBEX_NODE_ORACLE_BIN=$(command -v node)" >> "$GITHUB_ENV"

      - name: Install Java for Android bridge behavior tests
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Python for linked-reference checks
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      # Cache the patched no-debugger framework + host tools. The explicit
      # profile version prevents an older debugger-enabled build with the same
      # source pin and patch digest from satisfying this cache.
      - name: Cache patched Hermes artifacts
        id: hermes-cache
        uses: actions/cache@v4
        with:
          path: |
            ios/Frameworks
            tools/hermes
            ~/.cache/exact/hermes
          key: hermes-patched-no-debugger-v2-${{ runner.os }}-${{ hashFiles('scripts/hermes-version.sh', 'scripts/download-hermes.sh', 'scripts/build-hermes.sh', 'scripts/apply-hermes-patches.sh', 'patches/hermes/**') }}

      - name: Build patched Hermes (on cache miss)
        if: steps.hermes-cache.outputs.cache-hit != 'true'
        run: ./scripts/download-hermes.sh
        env:
          # download-hermes.sh is download-first (ENG-23147): with a token, gh
          # can fetch the prebuilt patched bundle from this repo's artifact-cache
          # release instead of paying the ~hour source build on a key miss.
          GH_TOKEN: ${{ github.token }}

      - name: Verify cached Hermes is patched and debugger-free
        run: |
          set -euo pipefail
          binary="ios/Frameworks/hermesvm.framework/Versions/Current/hermesvm"
          test -f "$binary"
          symbols="$(nm -gU "$binary")"
          [[ "$symbols" == *ex_hermes_vm_current_package_id* ]] \
            || { echo "::error::Hermes framework lacks the patched attribution export"; exit 1; }
          if [[ "$symbols" == *AsyncDebuggerAPI* ]]; then
            echo "::error::Hermes framework exports debugger symbols"
            exit 1
          fi

      - name: Run the complete CapSec matrix and bind evidence
        run: >-
          bun run verify:capsec-conformance --
          --target aarch64-apple-darwin
          --expect-incomplete

      - name: Retain exact-engine suite and refusal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capsec-evidence-macos-arm64-${{ github.sha }}
          path: |
            target/capsec-ci-status.json
            target/capsec-executions.json
            target/capsec-conformance-report.json
            target/capsec-suite-evidence-*/**
          if-no-files-found: error
          retention-days: 14

  conformance-windows:
    name: Complete matrix + unadvertised evidence (Windows x64)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'both' || inputs.target == 'windows' }}
    runs-on: windows-2022
    timeout-minutes: 240
    env:
      HERMES_ENABLE_DEBUGGER: "false"
    steps:
      - name: Check out Ibex
        uses: actions/checkout@v4

      - name: Configure MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Bind MSVC linker across Git Bash suites
        shell: pwsh
        run: |
          $linker = Join-Path $env:VCToolsInstallDir "bin\Hostx64\x64\link.exe"
          if (-not (Test-Path -LiteralPath $linker -PathType Leaf)) {
            throw "MSVC linker is missing from the configured toolchain: $linker"
          }
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$linker" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.93.1 --profile minimal
          rustup default 1.93.1

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install Node compatibility oracle
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.1

      - name: Bind exact Node compatibility oracle
        shell: pwsh
        run: |
          $node = (Get-Command node).Source
          "IBEX_NODE_ORACLE_BIN=$node" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Java for Android bridge behavior tests
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Python for linked-reference checks
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install JS dependencies
        shell: pwsh
        run: bun install --frozen-lockfile

      - name: Cache patched Hermes artifacts
        id: windows-hermes-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            tools/hermes/windows-x64
            ~/AppData/Local/Exact/hermes-windows
          key: hermes-patched-no-debugger-v2-${{ runner.os }}-x64-${{ hashFiles('scripts/hermes-version.sh', 'scripts/install-windows-hermes.ps1', 'scripts/build-hermes-windows.ps1', 'scripts/apply-hermes-patches.sh', 'patches/hermes/**') }}

      - name: Install patched no-debugger Release Hermes
        shell: pwsh
        run: ./scripts/install-windows-hermes.ps1 -Arch x64
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Retain Windows engine-profile preflight state
        if: always()
        shell: pwsh
        run: |
          $directory = Join-Path $PWD "target\capsec-suite-evidence-engine-preflight"
          New-Item -ItemType Directory -Force -Path $directory | Out-Null
          @(
            "sourceRevision=${{ github.sha }}"
            "target=x86_64-pc-windows-msvc"
            "stage=windows-engine-profile"
          ) | Set-Content -LiteralPath (Join-Path $directory "status.txt") -Encoding utf8NoBOM

      - name: Verify cached Hermes is patched and debugger-free
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $install = Join-Path $PWD "tools\hermes\windows-x64"
          $dll = Join-Path $install "bin\hermesvm.dll"
          $manifest = Get-Content -LiteralPath (Join-Path $install "artifact.json") -Raw | ConvertFrom-Json
          $builderDigest = (Get-FileHash -Algorithm SHA256 -LiteralPath "scripts\build-hermes-windows.ps1").Hash.ToLowerInvariant()
          $dllDigest = (Get-FileHash -Algorithm SHA256 -LiteralPath $dll).Hash.ToLowerInvariant()
          if ($manifest.configuration -ne "Release" -or
              $manifest.debugger -ne $false -or
              $manifest.architecture -ne "x64" -or
              $manifest.sourceBuildAuthorityDigest -ne $builderDigest -or
              $manifest.binarySha256 -ne $dllDigest) {
            throw "Windows Hermes artifact is not bound to the current no-debugger Release build authority"
          }
          $exports = dumpbin /exports $dll | Out-String
          if ($exports -notmatch 'ex_hermes_vm_current_package_id') {
            throw "Hermes DLL lacks the patched attribution export"
          }
          if ($exports -match 'CDPAgent|CDPDebugAPI') {
            throw "Hermes DLL exports debugger symbols"
          }
          # @ref LLP 0026#adoption-gate — the producer corpus must execute on
          # the real bundled Hermes CLI and may never pass by skipping it.
          $hermesCli = Join-Path $install "bin\hermes.exe"
          if (-not (Test-Path -LiteralPath $hermesCli -PathType Leaf)) {
            throw "Windows Hermes CLI is missing from the verified artifact: $hermesCli"
          }
          & $hermesCli --help | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "Windows Hermes CLI failed its executable preflight"
          }
          "IBEX_HERMES_BIN=$hermesCli" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # A later matrix failure must not discard a verified 25-minute source
      # build. Save it before the suites so the next diagnostic run reuses the
      # exact Release authority instead of rebuilding it.
      - name: Save verified Windows Hermes artifacts
        if: steps.windows-hermes-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            tools/hermes/windows-x64
            ~/AppData/Local/Exact/hermes-windows
          key: hermes-patched-no-debugger-v2-${{ runner.os }}-x64-${{ hashFiles('scripts/hermes-version.sh', 'scripts/install-windows-hermes.ps1', 'scripts/build-hermes-windows.ps1', 'scripts/apply-hermes-patches.sh', 'patches/hermes/**') }}

      - name: Run focused startup and package-principal evidence
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.scope == 'startup' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $directory = Join-Path $PWD "target\capsec-focused-windows"
          New-Item -ItemType Directory -Force -Path $directory | Out-Null
          $catalog = Join-Path $directory "executable-recipes.json"
          bun packages/ibex-devtools/src/scripts/generate-capsec-conformance-recipes.mjs --target x86_64-pc-windows-msvc --output $catalog
          if ($LASTEXITCODE -ne 0) { throw "focused recipe generation failed" }
          $env:IBEX_CAPSEC_RECIPE_CATALOG = $catalog
          cargo test --bin ibex --features capsec-conformance-observer,openssl-crypto capsec_callback_invariant_mechanisms_smoke -- --test-threads=1 --nocapture 2>&1 |
            Tee-Object -FilePath (Join-Path $directory "wrapper-and-callback-principal.log")
          $callbackExit = $LASTEXITCODE
          $env:IBEX_CAPSEC_PUBLIC_BATCH_EVIDENCE_OUTPUT = Join-Path $directory "startup-environment-evidence.json"
          cargo test --bin ibex --features capsec-conformance-observer,openssl-crypto capsec_public_startup_environment_batch -- --test-threads=1 --nocapture 2>&1 |
            Tee-Object -FilePath (Join-Path $directory "startup-environment.log")
          $startupExit = $LASTEXITCODE
          if ($callbackExit -ne 0 -or $startupExit -ne 0) {
            throw "focused principal evidence failed (wrapper/callback=$callbackExit, startup=$startupExit)"
          }

      - name: Run focused module-semantics baseline
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.scope == 'module-semantics' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $directory = Join-Path $PWD "target\capsec-focused-windows"
          New-Item -ItemType Directory -Force -Path $directory | Out-Null
          $env:IBEX_MODULE_SEMANTICS_OBSERVATIONS_OUTPUT =
            Join-Path $directory "module-semantics-observations.json"
          cargo test --test module_semantics_baseline -- --exact --test-threads=1 --nocapture 2>&1 |
            Tee-Object -FilePath (Join-Path $directory "module-semantics.log")
          if ($LASTEXITCODE -ne 0) { throw "focused module-semantics baseline failed" }

      - name: Run focused native DNS fidelity suite
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.scope == 'dns' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $directory = Join-Path $PWD "target\capsec-focused-windows"
          New-Item -ItemType Directory -Force -Path $directory | Out-Null
          cargo test --test native_dns_rcode -- --exact --test-threads=1 --nocapture 2>&1 |
            Tee-Object -FilePath (Join-Path $directory "native-dns-rcode.log")
          if ($LASTEXITCODE -ne 0) { throw "focused native DNS fidelity suite failed" }

      - name: Run focused target-absence evidence
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.scope == 'target-absence' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $directory = Join-Path $PWD "target\capsec-focused-windows"
          New-Item -ItemType Directory -Force -Path $directory | Out-Null
          $catalog = Join-Path $directory "executable-recipes.json"
          $evidence = Join-Path $directory "target-absence-evidence.json"
          bun packages/ibex-devtools/src/scripts/generate-capsec-conformance-recipes.mjs --target x86_64-pc-windows-msvc --output $catalog
          if ($LASTEXITCODE -ne 0) { throw "focused recipe generation failed" }
          $env:IBEX_CAPSEC_RECIPE_CATALOG = $catalog
          $env:IBEX_CAPSEC_PUBLIC_BATCH_EVIDENCE_OUTPUT = $evidence
          cargo test --bin ibex --features capsec-conformance-observer,openssl-crypto capsec_public_target_absence_batch -- --test-threads=1 --nocapture 2>&1 |
            Tee-Object -FilePath (Join-Path $directory "target-absence.log")
          if ($LASTEXITCODE -ne 0) { throw "focused target-absence evidence failed" }

      - name: Run focused filesystem queue-rejection evidence
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.scope == 'fs-queue' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $directory = Join-Path $PWD "target\capsec-focused-windows"
          New-Item -ItemType Directory -Force -Path $directory | Out-Null
          cargo test --test native_fs_pool queue_rejection_releases_owned_fds_and_rolls_back_close -- --exact --test-threads=1 --nocapture 2>&1 |
            Tee-Object -FilePath (Join-Path $directory "native-fs-queue-rejection.log")
          if ($LASTEXITCODE -ne 0) { throw "focused filesystem queue-rejection evidence failed" }

      - name: Run the complete CapSec matrix and bind evidence
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.scope == 'full' }}
        shell: pwsh
        run: >-
          bun run verify:capsec-conformance --
          --target x86_64-pc-windows-msvc
          --engine-artifact tools/hermes/windows-x64/bin/hermesvm.dll
          --expect-incomplete

      - name: Retain exact-engine suite and refusal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capsec-evidence-windows-x64-${{ github.sha }}
          path: |
            target/capsec-ci-status.json
            target/capsec-executions.json
            target/capsec-conformance-report.json
            target/capsec-suite-evidence-*/**
            target/capsec-focused-windows/**
          if-no-files-found: error
          retention-days: 14
