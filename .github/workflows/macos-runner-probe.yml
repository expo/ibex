# Temporary: proves which macOS runner labels this repository can use for the
# Hermes release builders. Remove once hermes-vanilla-build.yml is switched.
name: macOS runner probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15-xlarge, macos-15-large]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - run: |
          uname -m
          sw_vers
          sysctl -n hw.ncpu hw.memsize
          xcodebuild -version
