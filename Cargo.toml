[package]
name = "ibex-runtime"
version = "0.1.0"
edition = "2021"
description = "Ibex runtime - Hermes JS engine, module loader, and host ABI"
authors = ["Ibex Runtime Team"]
license = "MIT"

[workspace]
members = ["crates/capsec-semantics"]
resolver = "2"

[lib]
name = "ibex_runtime"
crate-type = ["staticlib", "rlib"]

[[bin]]
name = "ibex"
path = "src/bin/ibex/main.rs"

[dependencies]
capsec-semantics = { path = "crates/capsec-semantics" }
# Error handling
thiserror = "1.0"
anyhow = "1.0"

# CLI argument parsing and shell completions for the `ibex` binary.
clap = { version = "4.4", features = ["derive"] }
clap_complete = "4.4"

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# JSON handling
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Random bytes for crypto
getrandom = "0.2"

# SQLite support for exact:sqlite builtin module
rusqlite = { version = "0.31", features = ["bundled", "column_decltype", "hooks"] }

# Module resolution (Node/ESM)
oxc_resolver = "11.17.0"
oxc_ast = "=0.121.0"
oxc_ast_visit = "=0.121.0"
oxc_allocator = "=0.121.0"
oxc_codegen = "=0.121.0"
oxc_parser = "=0.121.0"
oxc_semantic = "=0.121.0"
oxc_span = "=0.121.0"
oxc_transformer = "=0.121.0"

# Async trait support
async-trait = "0.1"

# Base64 for source maps
base64 = "0.22"
sha2 = "0.10"

# HTTP server host bridge
hyper = { version = "1.1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "http1", "http2", "server-auto", "server-graceful"] }
h2 = "0.4"
http-body-util = "0.1"
futures-util = "0.3"
socket2 = "0.6.2"
tokio-tungstenite = "0.21"

# File watching and REPL support for the `ibex` binary.
notify = "6.1"
rustyline = "14.0"
colored = "2.1"

# Path handling
dirs = "5.0"

# Fixture glob matching for the hidden `ibex compat` harness command
# (ENG-23081; same version the pre-split exact-cli pinned).
glob = "0.3"

# Process handling
which = "6.0"

# For FFI string handling
libc = "0.2"

# Native TLS bridge for the `tls` builtin (ENG-23492/ENG-23526): sans-IO
# rustls client engine driven from the JS event loop. `ring` provider
# (cc-compiled, no cmake/system OpenSSL) keeps the default build hermetic per
# LLP 0005; webpki-roots bundles the Mozilla CA store the way Node bundles its
# roots. @ref LLP 0004#the-tls-builtin — native bridge dependency choice
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26"
rustls-pemfile = "2"

swc_common = "23.0.1"
swc_ecma_ast = "25.0.0"
swc_ecma_parser = "41.0.1"
swc_ecma_codegen = "28.0.1"
swc_ecma_visit = "25.0.0"
swc_ecma_transforms_base = { version = "44.0.2", features = ["inline-helpers"] }
swc_ecma_transforms_typescript = "49.0.0"
swc_ecma_transforms_module = "49.0.0"
swc_ecma_transforms_react = "49.0.0"

[features]
default = []
app-host = []
# Compiles the hyper-based localhost HTTP server backing `exact:http` and the
# agent endpoints (the `ex_host_http_*` C symbols). App hosts and the full
# `ibex` CLI profile enable this; without it build.rs compiles no-op stubs
# instead. @ref LLP 0005#c-compilation
host-http-server = []
openssl-crypto = ["dep:openssl-sys"]
# When enabled, skips the default ex_hermes_notify_callback implementation.
# The `ibex` binary provides its own tokio-based version.
cli-notify = []

[target.'cfg(not(target_os = "ios"))'.dependencies]
openssl-sys = { version = "0.9", features = ["vendored"], optional = true }

[target.'cfg(windows)'.dependencies]
# Windows does not ship a C zlib development package. Build zlib from source so
# the native deflate/inflate host functions can be registered deterministically.
libz-sys = { version = "1.1", features = ["static"] }

[build-dependencies]
cc = "1.0"

[dev-dependencies]
libc = "0.2"
sha1 = "0.10"
tempfile = "3"

# LLP 0013 Goal 3 steady-state overhead benchmark. `harness = false` because the
# unit of work is a whole `ibex` subprocess (not an in-process microbenchmark),
# so the bench provides its own warmup + median-of-N `main` rather than using
# criterion. @ref LLP 0013#goals
[[bench]]
name = "compartment_overhead"
harness = false
