name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.93.1 --profile minimal --component rustfmt --component clippy --component rust-src
          rustup default 1.93.1

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Validate LLP references
        run: ./ref-check

      - name: Check Rust formatting
        run: cargo fmt --check

      # Native Cargo builds/tests need per-platform Hermes artifacts. LLP 0001
      # tracks the full matrix; this job stays on hermetic preflight checks.
      - name: Validate Cargo metadata
        run: cargo metadata --no-deps --format-version 1 > /tmp/ibex-cargo-metadata.json

      # Hermes-gated cases inside the suite skip themselves when no hermes
      # binary is present (transforms.test.mjs probes IBEX_HERMES_BIN and the
      # exact-monorepo tools/hermes layout).
      - name: Run JS test suites
        run: bun test packages

      # One drift gate, shared verbatim with the local land-time check so CI
      # and `bun run check:drift` can never diverge on what "current" means
      # (a divergent inline copy previously covered builtin_manifest.generated.rs
      # while the local gate did not). @ref LLP 0018#5-make-the-dev-build-loud-when-vendored-generated-is-stale
      - name: Check generated artifacts (drift gate)
        run: bun run check:drift
