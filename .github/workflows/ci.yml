name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.93.1 --profile minimal --component rustfmt --component clippy --component rust-src
          rustup default 1.93.1

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Validate LLP references
        run: ./ref-check

      - name: Check Rust formatting
        run: cargo fmt --check

      # Native Cargo builds/tests need per-platform Hermes artifacts. LLP 0001
      # tracks the full matrix; this job stays on hermetic preflight checks.
      - name: Validate Cargo metadata
        run: cargo metadata --no-deps --format-version 1 > /tmp/ibex-cargo-metadata.json

      # Hermes-gated cases inside the suite skip themselves when no hermes
      # binary is present (transforms.test.mjs probes IBEX_HERMES_BIN and the
      # exact-monorepo tools/hermes layout).
      - name: Run JS test suites
        run: bun test packages

      - name: Check generated identity bindings
        run: bun packages/ibex-devtools/src/scripts/generate-runtime-identity.ts --check

      - name: Check generated capability bits
        run: bun packages/ibex-devtools/src/scripts/generate-capability-bits.mjs --check

      - name: Check generated module manifest
        run: bun packages/ibex-devtools/src/scripts/generate-module-manifest.ts --check --rust-out-dir vendored-generated

      - name: Check vendored JS snapshot
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"

          bun packages/ibex-devtools/src/scripts/build-builtins.mjs \
            --src-dir src/builtins \
            --out-dir "$tmp/builtins"
          diff -rq vendored-generated/builtins "$tmp/builtins"

          bun packages/ibex-devtools/src/scripts/rolldown-bundle.mjs \
            --entry packages/ibex-runtime-js/src/runtime-entry.ts \
            --out "$tmp/embedded_runtime_bundle.js" \
            --format iife \
            --lower-classes
          cmp vendored-generated/embedded_runtime_bundle.js "$tmp/embedded_runtime_bundle.js"
