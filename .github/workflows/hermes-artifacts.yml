# @ref LLP 0005#prebuilt-hermes-artifact-bundles — publish the PATCHED Hermes
# engine (LLP 0013 stack applied by build-hermes*.sh before building) as
# per-platform GitHub Release bundles, so scripts/download-hermes.sh can
# download-first on cold clones instead of paying the ~hour from-source build
# (ENG-23147, the "best option" half of ENG-22565/ENG-23092).
#
# The release tag is hermes-<hermes-commit-12>-<patch-digest-12>. Platform asset
# names and local caches additionally key both platform build authorities, the
# patch-application authority, and the shared receipt/identity authority;
# bundles carry that exact profile receipt. Editing any receipt authority
# therefore selects a new asset/cache path even when the release tag remains
# the same; an older bundle cannot satisfy the key.
#
# Releases created here are ARTIFACT CACHES, not product releases: always
# prerelease, titled "Hermes artifact cache …".
name: Hermes artifact cache

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild and overwrite release assets even if they already exist"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "scripts/hermes-version.sh"
      - "patches/hermes/**"
      - "scripts/build-hermes.sh"
      - "scripts/build-hermes-linux.sh"
      - "scripts/apply-hermes-patches.sh"
      - ".github/workflows/hermes-artifacts.yml"

# Serialize runs: two overlapping publishes for the same identity would race
# on release creation/uploads.
concurrency:
  group: hermes-artifacts
  cancel-in-progress: false

permissions:
  attestations: write
  contents: write
  id-token: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  identity:
    name: Resolve artifact identity
    runs-on: ubuntu-latest
    outputs:
      identity: ${{ steps.compute.outputs.identity }}
      tag: ${{ steps.compute.outputs.tag }}
      macos_cache_key: ${{ steps.compute.outputs.macos_cache_key }}
      linux_cache_key: ${{ steps.compute.outputs.linux_cache_key }}
      need_macos: ${{ steps.assets.outputs.need_macos }}
      need_linux: ${{ steps.assets.outputs.need_linux }}
    steps:
      - name: Check out Ibex
        uses: actions/checkout@v4

      - name: Verify source-build lock and cache-key contract
        run: ./scripts/hermes-build-lock.test.sh

      - name: Compute identity (pin + patch digest)
        id: compute
        run: |
          set -euo pipefail
          source scripts/hermes-version.sh
          commit12="${IBEX_HERMES_SOURCE_COMMIT:0:12}"
          digest="$(ibex_hermes_patch_digest)"
          identity="${commit12}-${digest}"
          macos_cache_key="$(ibex_hermes_apple_source_cache_key "$commit12" "-debug")"
          linux_cache_key="$(ibex_hermes_linux_source_cache_key "$commit12")"
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
          echo "tag=hermes-$identity" >> "$GITHUB_OUTPUT"
          echo "macos_cache_key=$macos_cache_key" >> "$GITHUB_OUTPUT"
          echo "linux_cache_key=$linux_cache_key" >> "$GITHUB_OUTPUT"
          echo "Artifact identity: $identity"
          echo "macOS source cache key: $macos_cache_key"
          echo "Linux source cache key: $linux_cache_key"

      - name: Ensure artifact-cache release exists (idempotent)
        run: |
          set -euo pipefail
          tag="${{ steps.compute.outputs.tag }}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists."
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --prerelease \
              --title "Hermes artifact cache ${{ steps.compute.outputs.identity }}" \
              --notes "Prebuilt PATCHED Hermes bundles (LLP 0013 patch stack applied) for \`scripts/download-hermes.sh\`. Release identity = pinned Hermes commit (12) + patches/hermes digest (12); each platform asset name additionally binds both builders plus the patch-application and receipt/identity authorities. This is an artifact cache, not a product release. Published by the hermes-artifacts workflow (ENG-23147)." \
              --target "$GITHUB_SHA"
          fi

      - name: Check which platform assets are needed
        id: assets
        run: |
          set -euo pipefail
          tag="${{ steps.compute.outputs.tag }}"
          identity="${{ steps.compute.outputs.identity }}"
          force="${{ inputs.force }}"
          existing="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')"
          need() {
            if [ "$force" = "true" ]; then echo true
            elif printf '%s\n' "$existing" | grep -qx "$1"; then echo false
            else echo true
            fi
          }
          {
            echo "need_macos=$(need "hermes-macos-arm64-${{ steps.compute.outputs.macos_cache_key }}.tar.gz")"
            echo "need_linux=$(need "hermes-linux-x64-${{ steps.compute.outputs.linux_cache_key }}.tar.gz")"
          } >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT" || true

  macos:
    name: Build + publish macOS bundle (arm64)
    needs: identity
    if: needs.identity.outputs.need_macos == 'true'
    runs-on: macos-14
    timeout-minutes: 180
    env:
      IDENTITY: ${{ needs.identity.outputs.identity }}
      TAG: ${{ needs.identity.outputs.tag }}
      SOURCE_CACHE_KEY: ${{ needs.identity.outputs.macos_cache_key }}
    steps:
      - name: Check out Ibex
        uses: actions/checkout@v4

      # build-hermes.sh checks out the pin, applies patches/hermes/*, and
      # builds host hermesc/hermes + iOS/simulator/macOS frameworks. It never
      # downloads, so there is no circularity with download-hermes.sh.
      - name: Build patched Hermes from source
        run: ./scripts/build-hermes.sh

      - name: Verify bundle contents + patched export
        run: |
          set -euo pipefail
          source scripts/hermes-version.sh
          cache="$HOME/.cache/exact/hermes/$SOURCE_CACHE_KEY"
          echo "cache=$cache" >> "$GITHUB_ENV"
          test -d "$cache/hermesvm.xcframework"
          test -d "$cache/hermesvm.framework"
          test -f "$cache/hermes-profile-provenance.json"
          ibex_hermes_profile_receipt_has_cache_key "$cache/hermes-profile-provenance.json" "$SOURCE_CACHE_KEY"
          test -f "$cache/include/jsi/jsi.h"
          test -x "$cache/bin/hermesc"
          test -x "$cache/bin/hermes"
          # The published engine must be the PATCHED one: an unpatched bundle
          # makes the 18 frame-attribution tests skip vacuously (LLP 0013/0018).
          nm -gU "$cache/hermesvm.framework/Versions/1/hermesvm" | grep -q ex_hermes_vm_current_package_id \
            || { echo "::error::built framework lacks ex_hermes_vm_current_package_id (patch stack not applied?)"; exit 1; }
          "$cache/bin/hermesc" --help >/dev/null
          "$cache/bin/hermes" --help >/dev/null
          echo "Bundle verified: patched export present, host tools run."

      - name: Package + checksum
        run: |
          set -euo pipefail
          asset="hermes-macos-arm64-$SOURCE_CACHE_KEY.tar.gz"
          tar -C "$cache" -czf "$asset" hermesvm.xcframework hermesvm.framework hermes-profile-provenance.json include bin
          shasum -a 256 "$asset" > "$asset.sha256"
          ls -lh "$asset"*

      - name: Attest bundle provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: hermes-macos-arm64-${{ env.SOURCE_CACHE_KEY }}.tar.gz

      - name: Upload to release (idempotent overwrite)
        run: |
          set -euo pipefail
          asset="hermes-macos-arm64-$SOURCE_CACHE_KEY.tar.gz"
          gh release upload "$TAG" "$asset" "$asset.sha256" --repo "$GITHUB_REPOSITORY" --clobber

  linux:
    name: Build + publish Linux bundle (x64)
    needs: identity
    if: needs.identity.outputs.need_linux == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      IDENTITY: ${{ needs.identity.outputs.identity }}
      TAG: ${{ needs.identity.outputs.tag }}
      SOURCE_CACHE_KEY: ${{ needs.identity.outputs.linux_cache_key }}
    steps:
      - name: Check out Ibex
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Build patched Hermes from source
        run: ./scripts/build-hermes-linux.sh

      - name: Verify bundle contents + patched export
        run: |
          set -euo pipefail
          source scripts/hermes-version.sh
          install="${XDG_CACHE_HOME:-$HOME/.cache}/exact/hermes-linux/install"
          echo "install=$install" >> "$GITHUB_ENV"
          test -f "$install/include/jsi/jsi.h"
          test -x "$install/bin/hermesc"
          lib_file="$(find "$install/lib" -maxdepth 1 -name 'libhermesvm.*' -print -quit)"
          test -n "$lib_file"
          case "$lib_file" in
            *.so)
              nm -D "$lib_file" | grep -q ex_hermes_vm_current_package_id
              test -f "$install/lib/hermes-profile-provenance.json"
              ibex_hermes_profile_receipt_has_cache_key "$install/lib/hermes-profile-provenance.json" "$SOURCE_CACHE_KEY"
              ;;
            *)    nm "$lib_file" 2>/dev/null | grep -q ex_hermes_vm_current_package_id ;;
          esac || { echo "::error::built lib lacks ex_hermes_vm_current_package_id (patch stack not applied?)"; exit 1; }
          "$install/bin/hermesc" --help >/dev/null
          echo "Bundle verified: patched export present, hermesc runs."

      - name: Package + checksum
        run: |
          set -euo pipefail
          asset="hermes-linux-x64-$SOURCE_CACHE_KEY.tar.gz"
          tar -C "$install" -czf "$asset" include lib bin
          shasum -a 256 "$asset" > "$asset.sha256"
          ls -lh "$asset"*

      - name: Attest bundle provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: hermes-linux-x64-${{ env.SOURCE_CACHE_KEY }}.tar.gz

      - name: Upload to release (idempotent overwrite)
        run: |
          set -euo pipefail
          asset="hermes-linux-x64-$SOURCE_CACHE_KEY.tar.gz"
          gh release upload "$TAG" "$asset" "$asset.sha256" --repo "$GITHUB_REPOSITORY" --clobber
