# @ref LLP 0021#wp10--prove-targets-and-publish-the-conformance-report — run the
# complete documented prerequisite matrix against one exact patched engine and
# retain its artifacts. Until every obligation is executable, CI must prove the
# candidate is incomplete and unadvertised rather than synthesizing promotion.
name: CapSec full matrix and evidence

on:
  workflow_dispatch:
  schedule:
    # Weekly, Monday 08:00 UTC (after the patch canary).
    - cron: "0 8 * * 1"
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: capsec-full-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  restricted-exact-linux:
    name: Restricted Exact profile evidence (Linux x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      HERMES_ENABLE_DEBUGGER: "false"
      # The committed restricted Exact surface includes Intl intrinsics. Keep
      # the physical engine build aligned with that surface instead of using
      # build-hermes-linux.sh's compatibility default (Intl disabled).
      HERMES_ENABLE_INTL: "true"
      IBEX_REQUIRE_HERMES_PROFILE_PROVENANCE: "true"
      IBEX_RESTRICTED_TARGET_TRIPLE: x86_64-unknown-linux-gnu
      LD_LIBRARY_PATH: ${{ github.workspace }}/linux/lib
      HERMES_PROFILE_PROVENANCE_RECEIPT: ${{ github.workspace }}/linux/lib/hermes-profile-provenance.json
    steps:
      - name: Check out Ibex
        uses: actions/checkout@v4
        with:
          # Evidence validation authenticates the source trees named by
          # committed prior reports. A shallow checkout cannot prove those
          # historical Git identities and must fail closed.
          fetch-depth: 0

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.93.1 --profile minimal
          rustup default 1.93.1

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Preflight CapSec governance before Hermes setup
        run: |
          bun run check:capsec-registry
          bun run check:example-policy

      - name: Install Linux native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libcurl4-openssl-dev

      - name: Cache patched Linux Hermes artifacts
        id: hermes-cache-linux
        uses: actions/cache@v4
        with:
          path: |
            linux/include
            linux/lib
            tools/hermes
            ~/.cache/exact/hermes-linux
          # The profile suffix prevents a legacy no-Intl artifact from being
          # restored into this exact-target evidence job. The source installer
          # also refuses the generic prebuilt path when Intl is requested.
          key: hermes-restricted-exact-no-debugger-intl-v1-Linux-${{ hashFiles('scripts/hermes-version.sh', 'scripts/download-hermes.sh', 'scripts/build-hermes-linux.sh', 'scripts/apply-hermes-patches.sh', 'patches/hermes/**') }}

      - name: Install patched no-debugger Release Hermes
        run: ./scripts/download-hermes.sh
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Verify Linux Hermes profile
        run: |
          set -euo pipefail
          test -f linux/lib/libhermesvm.so
          test -f linux/lib/hermes-profile-provenance.json
          symbols="$(nm -D linux/lib/libhermesvm.so)"
          [[ "$symbols" == *ex_hermes_vm_current_package_id* ]] \
            || { echo "::error::Hermes library lacks the patched attribution export"; exit 1; }
          if [[ "$symbols" == *AsyncDebuggerAPI* ]]; then
            echo "::error::Hermes library exports debugger symbols"
            exit 1
          fi

      - name: Execute restricted Exact target evidence
        id: restricted-evidence
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA:0:8}"
          evidence_dir="capsec/conformance/evidence/restricted-exact"
          reachable="$evidence_dir/reachable-x86_64-unknown-linux-gnu-$short_sha.json"
          observer="$evidence_dir/observer-equivalence-x86_64-unknown-linux-gnu-$short_sha.json"
          control="$evidence_dir/control-x86_64-unknown-linux-gnu-$short_sha.json"
          absence="$evidence_dir/absence-x86_64-unknown-linux-gnu-$short_sha.json"
          corpora="$evidence_dir/global-corpora-x86_64-unknown-linux-gnu-$short_sha.json"
          report="capsec/conformance/restricted-exact-x86_64-unknown-linux-gnu-report.json"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"

          IBEX_RESTRICTED_REACHABLE_EVIDENCE_OUTPUT="$reachable" \
            cargo test -p ibex-runtime --lib --release \
              --features capsec-conformance-observer \
              host::embedder_artifacts::tests::restricted_exact_reachable_edges_execute_on_the_bound_engine \
              -- --exact --nocapture --test-threads=1
          bun packages/ibex-devtools/src/scripts/run-restricted-exact-observer-equivalence.mjs \
            --binding-evidence "$reachable" \
            --output "$observer"
          IBEX_RESTRICTED_CONTROL_EVIDENCE_OUTPUT="$control" \
            cargo test -p ibex-runtime --lib --release \
              --features capsec-conformance-observer \
              host::embedder_artifacts::tests::restricted_exact_control_plane_edges_enforce_lifecycle_refusals \
              -- --exact --nocapture --test-threads=1
          IBEX_RESTRICTED_ABSENCE_EVIDENCE_OUTPUT="$absence" \
            cargo test -p ibex-runtime --lib --release \
              --features capsec-conformance-observer \
              host::embedder_artifacts::tests::restricted_exact_absence_edges_close_source_and_live_routes \
              -- --exact --nocapture --test-threads=1
          bun packages/ibex-devtools/src/scripts/run-restricted-exact-global-corpora.mjs \
            --binding-evidence "$reachable" \
            --observer-equivalence "$observer" \
            --output "$corpora"
          bun packages/ibex-devtools/src/scripts/generate-restricted-exact-target-report.mjs \
            "$reachable" "$control" "$absence" "$corpora" "$report" --write

      - name: Retain restricted Exact Linux evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restricted-exact-linux-x64-${{ github.sha }}
          path: |
            capsec/conformance/evidence/restricted-exact/*x86_64-unknown-linux-gnu-${{ steps.restricted-evidence.outputs.short_sha }}.json
            capsec/conformance/restricted-exact-x86_64-unknown-linux-gnu-report.json
          # A fail-fast edge assertion may intentionally produce no partial
          # evidence files. Preserve the primary test failure in the job log;
          # never replace it with a misleading retention-step failure.
          if-no-files-found: warn
          retention-days: 30

  restricted-exact-apple:
    name: Restricted Exact profile evidence (macOS arm64)
    runs-on: macos-14
    timeout-minutes: 240
    env:
      HERMES_ENABLE_DEBUGGER: "false"
      IBEX_REQUIRE_HERMES_PROFILE_PROVENANCE: "true"
      IBEX_RESTRICTED_TARGET_TRIPLE: aarch64-apple-darwin
      HERMES_PROFILE_PROVENANCE_RECEIPT: ${{ github.workspace }}/ios/Frameworks/hermes-profile-provenance.json
    steps:
      - name: Check out Ibex
        uses: actions/checkout@v4
        with:
          # Evidence validation authenticates the source trees named by
          # committed prior reports. A shallow checkout cannot prove those
          # historical Git identities and must fail closed.
          fetch-depth: 0

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.93.1 --profile minimal
          rustup default 1.93.1

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Preflight CapSec governance before Hermes setup
        run: |
          bun run check:capsec-registry
          bun run check:example-policy

      - name: Cache patched Apple Hermes artifacts
        id: hermes-cache-apple-restricted
        uses: actions/cache@v4
        with:
          path: |
            ios/Frameworks
            tools/hermes
            ~/.cache/exact/hermes
          key: hermes-patched-no-debugger-v2-${{ runner.os }}-${{ hashFiles('scripts/hermes-version.sh', 'scripts/download-hermes.sh', 'scripts/build-hermes.sh', 'scripts/build-hermes-linux.sh', 'scripts/apply-hermes-patches.sh', 'patches/hermes/**') }}

      - name: Build patched no-debugger Release Hermes (on cache miss)
        if: steps.hermes-cache-apple-restricted.outputs.cache-hit != 'true'
        run: ./scripts/download-hermes.sh
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Verify Apple Hermes profile
        run: |
          set -euo pipefail
          binary="ios/Frameworks/hermesvm.framework/Versions/Current/hermesvm"
          receipt="ios/Frameworks/hermes-profile-provenance.json"
          test -f "$binary"
          test -f "$receipt"
          symbols="$(nm -gU "$binary")"
          [[ "$symbols" == *ex_hermes_vm_current_package_id* ]] \
            || { echo "::error::Hermes framework lacks the patched attribution export"; exit 1; }
          if [[ "$symbols" == *AsyncDebuggerAPI* ]]; then
            echo "::error::Hermes framework exports debugger symbols"
            exit 1
          fi

      - name: Execute restricted Exact target evidence
        id: restricted-evidence
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA:0:8}"
          evidence_dir="capsec/conformance/evidence/restricted-exact"
          reachable="$evidence_dir/reachable-aarch64-apple-darwin-$short_sha.json"
          observer="$evidence_dir/observer-equivalence-aarch64-apple-darwin-$short_sha.json"
          control="$evidence_dir/control-aarch64-apple-darwin-$short_sha.json"
          absence="$evidence_dir/absence-aarch64-apple-darwin-$short_sha.json"
          corpora="$evidence_dir/global-corpora-aarch64-apple-darwin-$short_sha.json"
          report="capsec/conformance/restricted-exact-aarch64-apple-darwin-report.json"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"

          IBEX_RESTRICTED_REACHABLE_EVIDENCE_OUTPUT="$reachable" \
            cargo test -p ibex-runtime --lib --release \
              --features capsec-conformance-observer \
              host::embedder_artifacts::tests::restricted_exact_reachable_edges_execute_on_the_bound_engine \
              -- --exact --nocapture --test-threads=1
          bun packages/ibex-devtools/src/scripts/run-restricted-exact-observer-equivalence.mjs \
            --binding-evidence "$reachable" \
            --output "$observer"
          IBEX_RESTRICTED_CONTROL_EVIDENCE_OUTPUT="$control" \
            cargo test -p ibex-runtime --lib --release \
              --features capsec-conformance-observer \
              host::embedder_artifacts::tests::restricted_exact_control_plane_edges_enforce_lifecycle_refusals \
              -- --exact --nocapture --test-threads=1
          IBEX_RESTRICTED_ABSENCE_EVIDENCE_OUTPUT="$absence" \
            cargo test -p ibex-runtime --lib --release \
              --features capsec-conformance-observer \
              host::embedder_artifacts::tests::restricted_exact_absence_edges_close_source_and_live_routes \
              -- --exact --nocapture --test-threads=1
          bun packages/ibex-devtools/src/scripts/run-restricted-exact-global-corpora.mjs \
            --binding-evidence "$reachable" \
            --observer-equivalence "$observer" \
            --output "$corpora"
          bun packages/ibex-devtools/src/scripts/generate-restricted-exact-target-report.mjs \
            "$reachable" "$control" "$absence" "$corpora" "$report" --write

      - name: Retain restricted Exact Apple evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restricted-exact-macos-arm64-${{ github.sha }}
          path: |
            capsec/conformance/evidence/restricted-exact/*aarch64-apple-darwin-${{ steps.restricted-evidence.outputs.short_sha }}.json
            capsec/conformance/restricted-exact-aarch64-apple-darwin-report.json
          if-no-files-found: warn
          retention-days: 30

  conformance:
    name: Complete matrix + unadvertised evidence (macOS arm64)
    runs-on: macos-14
    timeout-minutes: 180
    env:
      # download-hermes.sh defaults to the developer/debug profile. This job
      # proves the physical Release target, so bind both artifact selection and
      # the C++ wrapper compile to the no-debugger profile explicitly.
      HERMES_ENABLE_DEBUGGER: "false"
    steps:
      - name: Check out Ibex
        uses: actions/checkout@v4
        with:
          # Generated-drift checks re-authenticate committed evidence against
          # its exact source revision, so retain the complete object history.
          fetch-depth: 0

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.93.1 --profile minimal
          rustup default 1.93.1

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install Node compatibility oracle
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.1

      - name: Bind exact Node compatibility oracle
        run: echo "IBEX_NODE_ORACLE_BIN=$(command -v node)" >> "$GITHUB_ENV"

      - name: Install Java for Android bridge behavior tests
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Python for linked-reference checks
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Preflight CapSec governance before Hermes setup
        run: |
          bun run check:capsec-registry
          bun run check:example-policy

      # Cache the patched no-debugger framework + host tools. The explicit
      # profile version prevents debugger-enabled reuse, while the hash binds
      # the pin, patch stack, installer, and source-build authorities that
      # issue the framework's provenance receipt.
      - name: Cache patched Hermes artifacts
        id: hermes-cache
        uses: actions/cache@v4
        with:
          path: |
            ios/Frameworks
            tools/hermes
            ~/.cache/exact/hermes
          key: hermes-patched-no-debugger-v2-${{ runner.os }}-${{ hashFiles('scripts/hermes-version.sh', 'scripts/download-hermes.sh', 'scripts/build-hermes.sh', 'scripts/build-hermes-linux.sh', 'scripts/apply-hermes-patches.sh', 'patches/hermes/**') }}

      - name: Build patched Hermes (on cache miss)
        if: steps.hermes-cache.outputs.cache-hit != 'true'
        run: ./scripts/download-hermes.sh
        env:
          # download-hermes.sh verifies the release bundle's workflow-bound
          # provenance, exact source-profile receipt, and no-debugger symbols;
          # a miss or failed validation falls back to the same source builder.
          GH_TOKEN: ${{ github.token }}

      - name: Verify cached Hermes is patched and debugger-free
        run: |
          set -euo pipefail
          binary="ios/Frameworks/hermesvm.framework/Versions/Current/hermesvm"
          test -f "$binary"
          symbols="$(nm -gU "$binary")"
          [[ "$symbols" == *ex_hermes_vm_current_package_id* ]] \
            || { echo "::error::Hermes framework lacks the patched attribution export"; exit 1; }
          if [[ "$symbols" == *AsyncDebuggerAPI* ]]; then
            echo "::error::Hermes framework exports debugger symbols"
            exit 1
          fi

      - name: Run the complete CapSec matrix and bind evidence
        run: >-
          bun run verify:capsec-conformance --
          --target aarch64-apple-darwin
          --expect-incomplete

      # This lane owns the reviewed source-patched profile. The runner first
      # learns the mapped Hermes identity/compiled target from Rust, then
      # authors and executes the matching inherited-intrinsic probe. Its
      # source receipt mechanically binds the mapped factory object's current
      # file bytes to the asserted reviewed fork identity; it does not hash
      # already-mapped executable pages. The ledger remains incomplete for absent
      # Android/Windows executions and for independent origin/record attestation;
      # installer-authored JSON alone is never promotion evidence.
      - name: Prove source-patched inherited intrinsic aliases
        run: >-
          bun packages/ibex-devtools/src/scripts/run-capsec-inherited-intrinsic-alias-conformance.mjs
          --profile source-patched
          --output-dir target/capsec-intrinsic-alias-source-patched

      - name: Retain exact-engine suite and refusal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capsec-evidence-macos-arm64-${{ github.sha }}
          path: |
            target/capsec-ci-status.json
            target/capsec-executions.json
            target/capsec-conformance-report.json
            target/capsec-suite-evidence-*/**
            target/capsec-intrinsic-alias-source-patched/**
          if-no-files-found: error
          retention-days: 14

  conformance-windows:
    name: Complete matrix + unadvertised evidence (Windows x64)
    runs-on: windows-2022
    timeout-minutes: 240
    env:
      HERMES_ENABLE_DEBUGGER: "false"
    steps:
      - name: Check out Ibex
        uses: actions/checkout@v4
        with:
          # Generated-drift checks re-authenticate committed evidence against
          # its exact source revision, so retain the complete object history.
          fetch-depth: 0

      - name: Configure MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.93.1 --profile minimal
          rustup default 1.93.1

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install Node compatibility oracle
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.1

      - name: Bind exact Node compatibility oracle
        shell: pwsh
        run: |
          $node = (Get-Command node).Source
          "IBEX_NODE_ORACLE_BIN=$node" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Java for Android bridge behavior tests
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Python for linked-reference checks
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install JS dependencies
        shell: pwsh
        run: bun install --frozen-lockfile

      - name: Preflight CapSec governance before Hermes setup
        shell: pwsh
        run: |
          bun run check:capsec-registry
          bun run check:runtime-environment-inventory
          bun run check:example-policy

      - name: Cache patched Hermes artifacts
        uses: actions/cache@v4
        with:
          path: |
            tools/hermes/windows-x64
            ~/AppData/Local/Exact/hermes-windows
          key: hermes-patched-no-debugger-v2-${{ runner.os }}-x64-${{ hashFiles('scripts/hermes-version.sh', 'scripts/install-windows-hermes.ps1', 'scripts/build-hermes-windows.ps1', 'scripts/apply-hermes-patches.sh', 'patches/hermes/**') }}

      - name: Install patched no-debugger Release Hermes
        shell: pwsh
        run: ./scripts/install-windows-hermes.ps1 -Arch x64
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Retain Windows engine-profile preflight state
        if: always()
        shell: pwsh
        run: |
          $directory = Join-Path $PWD "target\capsec-suite-evidence-engine-preflight"
          New-Item -ItemType Directory -Force -Path $directory | Out-Null
          @(
            "sourceRevision=${{ github.sha }}"
            "target=x86_64-pc-windows-msvc"
            "stage=windows-engine-profile"
          ) | Set-Content -LiteralPath (Join-Path $directory "status.txt") -Encoding utf8NoBOM

      - name: Verify cached Hermes is patched and debugger-free
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $install = Join-Path $PWD "tools\hermes\windows-x64"
          $dll = Join-Path $install "bin\hermesvm.dll"
          $manifest = Get-Content -LiteralPath (Join-Path $install "artifact.json") -Raw | ConvertFrom-Json
          $builderDigest = (Get-FileHash -Algorithm SHA256 -LiteralPath "scripts\build-hermes-windows.ps1").Hash.ToLowerInvariant()
          $dllDigest = (Get-FileHash -Algorithm SHA256 -LiteralPath $dll).Hash.ToLowerInvariant()
          if ($manifest.configuration -ne "Release" -or
              $manifest.debugger -ne $false -or
              $manifest.architecture -ne "x64" -or
              $manifest.sourceBuildAuthorityDigest -ne $builderDigest -or
              $manifest.binarySha256 -ne $dllDigest) {
            throw "Windows Hermes artifact is not bound to the current no-debugger Release build authority"
          }
          $exports = dumpbin /exports $dll | Out-String
          if ($exports -notmatch 'ex_hermes_vm_current_package_id') {
            throw "Hermes DLL lacks the patched attribution export"
          }
          if ($exports -match 'CDPAgent|CDPDebugAPI') {
            throw "Hermes DLL exports debugger symbols"
          }

      - name: Run the complete CapSec matrix and bind evidence
        shell: pwsh
        run: >-
          bun run verify:capsec-conformance --
          --target x86_64-pc-windows-msvc
          --engine-artifact tools/hermes/windows-x64/bin/hermesvm.dll
          --expect-incomplete

      - name: Retain exact-engine suite and refusal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capsec-evidence-windows-x64-${{ github.sha }}
          path: |
            target/capsec-ci-status.json
            target/capsec-executions.json
            target/capsec-conformance-report.json
            target/capsec-suite-evidence-*/**
          if-no-files-found: error
          retention-days: 14
