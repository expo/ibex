# @ref LLP 0021#wp10--prove-targets-and-publish-the-conformance-report — run the
# complete documented prerequisite matrix against one exact patched engine and
# retain its artifacts. Until every obligation is executable, CI must prove the
# candidate is incomplete and unadvertised rather than synthesizing promotion.
name: CapSec full matrix and evidence

on:
  workflow_dispatch:
  schedule:
    # Weekly, Monday 08:00 UTC (after the patch canary).
    - cron: "0 8 * * 1"
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: capsec-full-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    name: Complete matrix + unadvertised evidence (macOS arm64)
    runs-on: macos-14
    timeout-minutes: 180
    steps:
      - name: Check out Ibex
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.93.1 --profile minimal
          rustup default 1.93.1

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install Java for Android bridge behavior tests
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      # Cache the built patched framework + host hermesc, keyed on the pin,
      # patch content, and source-build authorities that issue its provenance
      # receipt. A miss triggers the full Hermes build.
      - name: Cache patched Hermes artifacts
        id: hermes-cache
        uses: actions/cache@v4
        with:
          path: |
            ios/Frameworks
            tools/hermes
            ~/.cache/exact/hermes
          key: hermes-patched-${{ runner.os }}-${{ hashFiles('scripts/hermes-version.sh', 'scripts/build-hermes.sh', 'scripts/build-hermes-linux.sh', 'scripts/apply-hermes-patches.sh', 'patches/hermes/**') }}

      - name: Build patched Hermes (on cache miss)
        if: steps.hermes-cache.outputs.cache-hit != 'true'
        run: ./scripts/download-hermes.sh
        env:
          # Keep authenticated release access available for ordinary install
          # fallback diagnostics, though this proof lane forces source build.
          GH_TOKEN: ${{ github.token }}
          # A reviewed source profile needs a receipt issued by this exact
          # build authority. Prebuilt cache bundles predate that receipt and
          # remain usable for ordinary builds, but cannot close CapSec proof.
          IBEX_HERMES_FORCE_BUILD: "1"

      - name: Run the complete CapSec matrix and bind evidence
        run: bun run verify:capsec-conformance -- --expect-incomplete

      # This lane owns the reviewed source-patched profile. The runner first
      # learns the mapped Hermes identity/compiled target from Rust, then
      # authors and executes the matching inherited-intrinsic probe. Its
      # source receipt mechanically binds the mapped factory object's current
      # file bytes to the asserted reviewed fork identity; it does not hash
      # already-mapped executable pages. The ledger remains incomplete for absent
      # Android/Windows executions and for independent origin/record attestation;
      # installer-authored JSON alone is never promotion evidence.
      - name: Prove source-patched inherited intrinsic aliases
        run: >-
          bun packages/ibex-devtools/src/scripts/run-capsec-inherited-intrinsic-alias-conformance.mjs
          --profile source-patched
          --output-dir target/capsec-intrinsic-alias-source-patched

      - name: Retain exact-engine suite and refusal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capsec-evidence-${{ github.sha }}
          path: |
            target/capsec-ci-status.json
            target/capsec-executions.json
            target/capsec-conformance-report.json
            target/capsec-suite-evidence-*/**
            target/capsec-intrinsic-alias-source-patched/**
          if-no-files-found: error
          retention-days: 14
