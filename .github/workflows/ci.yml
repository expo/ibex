name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: scripts/install-rust-toolchain.sh

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install Java for Android bridge behavior tests
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Validate LLP references
        run: ./ref-check

      - name: Check Rust formatting
        run: cargo fmt --check

      # Native Cargo builds/tests need per-platform Hermes artifacts. LLP 0001
      # tracks the full matrix; this job stays on hermetic preflight checks.
      - name: Validate Cargo metadata
        run: cargo metadata --no-deps --format-version 1 > /tmp/ibex-cargo-metadata.json

      # The exact current inventory is an inverse gate while SWC remains. At
      # retirement its checked-in mode flips to a name-prefix prohibition for
      # every retained Cargo profile. @ref LLP 0028#4-reachability-inventory-and-retirement-matrix
      - name: Check Oxc retirement inventory and SWC dependency prefix
        run: bun run check:oxc-retirement

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Audit Rust dependencies
        run: cargo audit --deny warnings

      # The product-neutral semantic core has no Hermes dependency, so its
      # security contract can and should run in hermetic preflight CI.
      # @ref LLP 0021#wp2--implement-the-typed-policy-and-decision-core
      - name: Test CapSec semantic core
        run: cargo test -p capsec-semantics

      - name: Lint CapSec semantic core
        run: cargo clippy -p capsec-semantics --all-targets -- -D warnings

      - name: Test Windows DLL publication core
        run: cargo test -p ibex-windows-dll-staging

      - name: Test Android WebSocket flow controller
        run: bun run test:android-java

      # Hermes-gated cases inside the suite skip themselves when no hermes
      # binary is present (transforms.test.mjs probes IBEX_HERMES_BIN and the
      # exact-monorepo tools/hermes layout).
      - name: Run JS test suites
        run: |
          # Devtools and runtime tests intentionally replace process-global
          # compatibility hooks. Keep devtools separate, and give each runtime
          # test file a fresh global plus module cache so mocks cannot leak or
          # bind a product module before another file installs its own hooks.
          bun test packages/ibex-devtools/src/scripts
          mapfile -t runtime_tests < <(
            find packages/ibex-runtime-js/src -type f \( \
              -name '*.test.ts' -o -name '*.test.tsx' -o \
              -name '*.test.js' -o -name '*.test.jsx' -o \
              -name '*.test.mjs' -o -name '*.test.cjs' -o \
              -name '*.spec.ts' -o -name '*.spec.tsx' -o \
              -name '*.spec.js' -o -name '*.spec.jsx' -o \
              -name '*.spec.mjs' -o -name '*.spec.cjs' \
            \) -print |
                sort
          )
          test "${#runtime_tests[@]}" -gt 0
          for test_file in "${runtime_tests[@]}"; do
            bun test "$test_file"
          done

      # One drift gate, shared verbatim with the local land-time check so CI
      # and `bun run check:drift` can never diverge on what "current" means
      # (a divergent inline copy previously covered builtin_manifest.generated.rs
      # while the local gate did not). @ref LLP 0018#5-make-the-dev-build-loud-when-vendored-generated-is-stale
      - name: Check generated artifacts (drift gate)
        run: bun run check:drift

      - name: Check generated example policy
        run: bun run check:example-policy

  windows-staging:
    name: Windows Hermes DLL staging behavior
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        shell: bash
        run: scripts/install-rust-toolchain.sh

      # This package has no Hermes dependency. On Windows it additionally
      # exercises an exclusive destination handle, proving a stale loaded DLL
      # makes publication fail rather than falling through to old code.
      - name: Test locked, tampered, clock-skewed, and concurrent staging
        run: cargo test -p ibex-windows-dll-staging -- --test-threads=1

  oxc-latest-canary:
    name: Latest Oxc compatibility canary
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install current stable Rust
        run: rustup toolchain install stable --profile minimal

      # This deliberately has an independent lockfile and wildcard pins. It is
      # advisory: a new Oxc release turns the job red without destabilizing the
      # exact production transform identity. @ref LLP 0028#1-toolchain-and-pin-rotation--atomic-with-identity-rotation
      - name: Compile the production API smoke against latest Oxc
        run: cargo +stable check --manifest-path tools/oxc-latest-canary/Cargo.toml
