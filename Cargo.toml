[package]
name = "exact-runtime"
version = "0.1.0"
edition = "2021"
description = "Exact shared runtime - Hermes JS engine, module loader, and host ABI"
authors = ["Exact Team"]
license = "MIT"

[lib]
name = "exact_runtime"
crate-type = ["staticlib", "rlib"]

[dependencies]
# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# JSON handling
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Random bytes for crypto
getrandom = "0.2"

# SQLite support for exact:sqlite builtin module
rusqlite = { version = "0.31", features = ["bundled", "column_decltype"] }

# Module resolution (Node/ESM)
oxc_resolver = "11.17.0"

# Async trait support
async-trait = "0.1"

# Base64 for source maps
base64 = "0.21"

# HTTP server host bridge
hyper = { version = "1.1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "http1", "http2", "server-auto"] }
h2 = "0.4"
http-body-util = "0.1"
futures-util = "0.3"
socket2 = "0.6.2"

# Path handling
dirs = "5.0"

# Process handling
which = "6.0"

# For FFI string handling
libc = "0.2"
swc_common = "23.0.1"
swc_ecma_ast = "25.0.0"
swc_ecma_parser = "41.0.1"
swc_ecma_codegen = "28.0.1"
swc_ecma_visit = "25.0.0"
swc_ecma_transforms_base = { version = "44.0.2", features = ["inline-helpers"] }
swc_ecma_transforms_typescript = "49.0.0"
swc_ecma_transforms_module = "49.0.0"
swc_ecma_transforms_react = "49.0.0"

[features]
default = []
app-host = []
# Compiles the hyper-based localhost HTTP server backing `exact:http` and the
# agent endpoints (the `ex_host_http_*` C symbols). App hosts and the CLI enable
# this; without it build.rs compiles no-op stubs instead. @ref LLP 0005#c-compilation
host-http-server = []
openssl-crypto = ["dep:openssl-sys"]
# When enabled, skips the default ex_hermes_notify_callback implementation.
# The CLI provides its own tokio-based version.
cli-notify = []

[target.'cfg(not(target_os = "ios"))'.dependencies]
openssl-sys = { version = "0.9", features = ["vendored"], optional = true }

[build-dependencies]
cc = "1.0"

[dev-dependencies]
sha1 = "0.10"
tempfile = "3"
