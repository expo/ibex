[package]
name = "capsec-semantics"
version = "0.1.0"
edition = "2021"
description = "Product-neutral typed authorization semantics for CapSec"
license = "MIT"
publish = false

[dependencies]
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
ryu-js = "1.0"
sha2 = "0.10"
thiserror = "1.0"

[dev-dependencies]
proptest = "1.9"

[lints.rust]
unsafe_code = "forbid"
