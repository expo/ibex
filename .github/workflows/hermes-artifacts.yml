            fi
          fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease --title "$title" --notes "$notes"

      - name: Acquire cross-revision legacy publish lease
        id: legacy_publish_lock
        if: >-
          needs.release_state.outputs.need_macos == 'true' ||
          needs.release_state.outputs.need_linux == 'true' ||
          needs.release_state.outputs.need_macos_release_legacy == 'true' ||
          needs.release_state.outputs.need_windows == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          IDENTITY: ${{ needs.identity.outputs.identity }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
          TAG: ${{ needs.identity.outputs.tag }}
        run: |
          set -euo pipefail
          [[ "$IDENTITY" =~ ^[0-9a-f]{12}-[0-9a-f]{12}$ ]]
          [[ "$RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TAG" == "hermes-$IDENTITY" ]]
          lock_name="ibex-hermes-legacy-publish-$IDENTITY.lock"
          lock_path="$RUNNER_TEMP/$lock_name"
          observed_path="$RUNNER_TEMP/ibex-hermes-observed-legacy-lock.json"
          assets_path="$RUNNER_TEMP/ibex-hermes-release-assets-for-lock.json"
          LOCK_PATH="$lock_path" python3 - <<'PY'
          import json
          import os
          import pathlib
          import re

          run_id = os.environ["RUN_ID"]
          run_attempt = os.environ["RUN_ATTEMPT"]
          sha = os.environ["SHA"]
          if (not re.fullmatch(r"[1-9][0-9]*", run_id)
                  or not re.fullmatch(r"[1-9][0-9]*", run_attempt)
                  or not re.fullmatch(r"[0-9a-f]{40}", sha)):
              raise SystemExit("refusing malformed legacy lease identity")
          document = {
              "schema": "ibex/hermes-legacy-publish-lock/1",
              "runId": int(run_id),
              "runAttempt": int(run_attempt),
              "sourceRevision": sha,
          }
          pathlib.Path(os.environ["LOCK_PATH"]).write_text(
              json.dumps(document, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="ascii",
          )
          PY

          deadline=$((SECONDS + 1200))
          while true; do
            if (( SECONDS >= deadline )); then
              echo "::error::timed out acquiring the legacy publish lease"
              exit 1
            fi
            if gh release upload "$TAG" "$lock_path" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "acquired=true" >> "$GITHUB_OUTPUT"
              echo "Acquired legacy publish lease $lock_name"
              break
            fi

            release_id="$(gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.id')"
            [[ "$release_id" =~ ^[1-9][0-9]*$ ]]
            gh api --paginate --slurp \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" > "$assets_path"
            if ! asset_record="$(LOCK_NAME="$lock_name" python3 -c "$IBEX_LEASE_ASSET_METADATA_VALIDATOR" "$assets_path")"; then
              if (( SECONDS >= deadline )); then
                echo "::error::could not observe or acquire the legacy publish lease"
                exit 1
              fi
              sleep 3
              continue
            fi
            read -r asset_id asset_size asset_state asset_decision <<< "$asset_record"
            [[ "$asset_id" =~ ^[1-9][0-9]*$ ]]
            [[ "$asset_size" =~ ^[0-9]+$ ]]
            [[ "$asset_state" =~ ^[^[:space:]]+$ ]]
            case "$asset_decision" in
              download)
                ;;
              wait-starter|wait-unknown-state)
                echo "Legacy lease asset $asset_id is still being created or has an unknown state; waiting."
                sleep 3
                continue
                ;;
              delete-stale-starter|delete-invalid-uploaded)
                echo "::warning::deleting proven-stale or invalid legacy lease asset $asset_id"
                gh api \
                  --method DELETE \
                  -H "Accept: application/vnd.github+json" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" >/dev/null 2>&1 || true
                continue
                ;;
              *)
                echo "::error::unexpected legacy lease asset decision"
                exit 1
                ;;
            esac

            if ! gh api \
              -H "Accept: application/octet-stream" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" > "$observed_path"; then
              rm -f "$observed_path"
              echo "::warning::uploaded legacy lease asset $asset_id is temporarily unavailable; waiting"
              sleep 3
              continue
            fi
            if owner="$(python3 - "$observed_path" <<'PY'
          import json
          import pathlib
          import re
          import sys

          def pairs(items):
              result = {}
              for key, value in items:
                  if key in result:
                      raise ValueError(f"duplicate key {key!r}")
                  result[key] = value
              return result

          def reject_constant(value):
              raise ValueError(f"non-finite value {value}")

          try:
              raw = pathlib.Path(sys.argv[1]).read_bytes()
              if not 0 < len(raw) <= 4096:
                  raise ValueError("unsafe lease size")
              text = raw.decode("utf-8", errors="strict")
              document = json.loads(
                  text,
                  object_pairs_hook=pairs,
                  parse_constant=reject_constant,
              )
          except (UnicodeDecodeError, json.JSONDecodeError, ValueError):
              raise SystemExit(1)
          if (not isinstance(document, dict)
                  or set(document) != {"schema", "runId", "runAttempt", "sourceRevision"}
                  or document.get("schema") != "ibex/hermes-legacy-publish-lock/1"
                  or type(document.get("runId")) is not int
                  or not 0 < document["runId"] <= 9007199254740991
                  or type(document.get("runAttempt")) is not int
                  or not 0 < document["runAttempt"] <= 9007199254740991
                  or not isinstance(document.get("sourceRevision"), str)
                  or not re.fullmatch(r"[0-9a-f]{40}", document["sourceRevision"])):
              raise SystemExit(1)
          print(document["runId"], document["runAttempt"], document["sourceRevision"])
          PY
            )"; then
              read -r owner_run owner_attempt owner_sha <<< "$owner"
            else
              owner_run=""
              owner_attempt=""
              owner_sha=""
            fi

            if [[ "$owner_run" == "$RUN_ID" && "$owner_attempt" == "$RUN_ATTEMPT" && "$owner_sha" == "$SHA" ]]; then
              echo "acquired=true" >> "$GITHUB_OUTPUT"
              echo "Recovered this attempt's already-created legacy publish lease"
              break
            fi

            owner_status=""
            observed_attempt=""
            observed_sha=""
            observed_workflow=""
            owner_missing=false
            owner_lookup_failed=false
            if [[ "$owner_run" =~ ^[1-9][0-9]*$ && "$owner_run" != "$RUN_ID" ]]; then
              owner_response_path="$RUNNER_TEMP/ibex-hermes-owner-run-response.txt"
              set +e
              gh api --include \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "repos/$GITHUB_REPOSITORY/actions/runs/$owner_run" \
                > "$owner_response_path" 2>/dev/null
              owner_api_exit=$?
              set -e
              if ! owner_observation="$(GH_API_EXIT="$owner_api_exit" python3 -c "$IBEX_ACTIONS_RUN_RESPONSE_VALIDATOR" "$owner_response_path")"; then
                owner_lookup_failed=true
              elif [[ "$owner_observation" == "missing" ]]; then
                owner_missing=true
                echo "Legacy publisher run $owner_run is definitively absent; its lease is stale."
              else
                IFS=$'\t' read -r owner_kind owner_status observed_attempt observed_sha observed_workflow <<< "$owner_observation"
                if [[ "$owner_kind" != "found" ]]; then
                  owner_lookup_failed=true
                fi
              fi
            fi
            owner_active=false
            if [[ "$owner_lookup_failed" == "false" && "$owner_missing" == "false" && "$owner_status" != "" ]]; then
              if [[ "$owner_status" != "completed" &&
                    "$observed_attempt" == "$owner_attempt" &&
                    "$observed_sha" == "$owner_sha" &&
                    "$observed_workflow" == ".github/workflows/hermes-artifacts.yml" ]]; then
                owner_active=true
              fi
            fi
            if [[ "$owner_run" != "" && "$owner_run" != "$RUN_ID" && ( "$owner_lookup_failed" == "true" || "$owner_active" == "true" ) ]]; then
              if (( SECONDS >= deadline )); then
                echo "::error::timed out proving legacy publisher run $owner_run inactive"
                exit 1
              fi
              echo "Legacy publisher run $owner_run is active or could not be proven inactive; waiting."
              sleep 5
              continue
            fi

            # Invalid, completed, or prior-attempt owners are stale.
            # Delete only the immutable asset ID that was inspected; a racing
            # replacement receives a different ID and cannot be removed here.
            gh api \
              --method DELETE \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" >/dev/null 2>&1 || true
            if (( SECONDS >= deadline )); then
              echo "::error::timed out recovering the legacy publish lease"
              exit 1
            fi
          done

      - name: Upload macOS provenance sidecars
        if: needs.release_state.outputs.need_macos == 'true'
        env:
          EXPECTED_NAME: ${{ needs.macos.outputs.asset_name }}
          EXPECTED_SHA256: ${{ needs.macos.outputs.asset_sha256 }}
          EXPECTED_SIZE: ${{ needs.macos.outputs.asset_size }}
          GH_TOKEN: ${{ github.token }}
          HANDOFF_DIR: ${{ runner.temp }}/ibex-hermes-publish/macos
          TAG: ${{ needs.identity.outputs.tag }}
        run: |
          python3 -c "$IBEX_RELEASE_SET_VALIDATOR"
          gh release upload "$TAG" \
            "$HANDOFF_DIR/$EXPECTED_NAME.sha256" \
            "$HANDOFF_DIR/$EXPECTED_NAME.sigstore.json" \
            "$HANDOFF_DIR/$EXPECTED_NAME.sigstore.json.sha256" \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Upload macOS archive last
        if: needs.release_state.outputs.need_macos == 'true'
        env:
          EXPECTED_NAME: ${{ needs.macos.outputs.asset_name }}
          EXPECTED_SHA256: ${{ needs.macos.outputs.asset_sha256 }}
          EXPECTED_SIZE: ${{ needs.macos.outputs.asset_size }}
          GH_TOKEN: ${{ github.token }}
          HANDOFF_DIR: ${{ runner.temp }}/ibex-hermes-publish/macos
          TAG: ${{ needs.identity.outputs.tag }}
        run: |
          python3 -c "$IBEX_RELEASE_SET_VALIDATOR"
          gh release upload "$TAG" "$HANDOFF_DIR/$EXPECTED_NAME" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Upload Linux provenance sidecars
        if: needs.release_state.outputs.need_linux == 'true'
        env:
          EXPECTED_NAME: ${{ needs.linux.outputs.asset_name }}
          EXPECTED_SHA256: ${{ needs.linux.outputs.asset_sha256 }}
          EXPECTED_SIZE: ${{ needs.linux.outputs.asset_size }}
          GH_TOKEN: ${{ github.token }}
          HANDOFF_DIR: ${{ runner.temp }}/ibex-hermes-publish/linux
          TAG: ${{ needs.identity.outputs.tag }}
        run: |
          python3 -c "$IBEX_RELEASE_SET_VALIDATOR"
          gh release upload "$TAG" \
            "$HANDOFF_DIR/$EXPECTED_NAME.sha256" \
            "$HANDOFF_DIR/$EXPECTED_NAME.sigstore.json" \
            "$HANDOFF_DIR/$EXPECTED_NAME.sigstore.json.sha256" \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Upload Linux archive last
        if: needs.release_state.outputs.need_linux == 'true'
        env:
          EXPECTED_NAME: ${{ needs.linux.outputs.asset_name }}
          EXPECTED_SHA256: ${{ needs.linux.outputs.asset_sha256 }}
          EXPECTED_SIZE: ${{ needs.linux.outputs.asset_size }}
          GH_TOKEN: ${{ github.token }}
          HANDOFF_DIR: ${{ runner.temp }}/ibex-hermes-publish/linux
          TAG: ${{ needs.identity.outputs.tag }}
        run: |
          python3 -c "$IBEX_RELEASE_SET_VALIDATOR"
          gh release upload "$TAG" "$HANDOFF_DIR/$EXPECTED_NAME" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Upload macOS Release provenance sidecars
        if: needs.release_state.outputs.need_macos_release_legacy == 'true'
        env:
          EXPECTED_NAME: ${{ needs.macos_release.outputs.legacy_asset_name }}
          EXPECTED_SHA256: ${{ needs.macos_release.outputs.legacy_asset_sha256 }}
          EXPECTED_SIZE: ${{ needs.macos_release.outputs.legacy_asset_size }}
          GH_TOKEN: ${{ github.token }}
          HANDOFF_DIR: ${{ runner.temp }}/ibex-hermes-publish/macos-release
          TAG: ${{ needs.identity.outputs.tag }}
        run: |
          python3 -c "$IBEX_RELEASE_SET_VALIDATOR"
          gh release upload "$TAG" \
            "$HANDOFF_DIR/$EXPECTED_NAME.sha256" \
            "$HANDOFF_DIR/$EXPECTED_NAME.sigstore.json" \
            "$HANDOFF_DIR/$EXPECTED_NAME.sigstore.json.sha256" \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Upload macOS Release archive last
        if: needs.release_state.outputs.need_macos_release_legacy == 'true'
        env:
          EXPECTED_NAME: ${{ needs.macos_release.outputs.legacy_asset_name }}
          EXPECTED_SHA256: ${{ needs.macos_release.outputs.legacy_asset_sha256 }}
          EXPECTED_SIZE: ${{ needs.macos_release.outputs.legacy_asset_size }}
          GH_TOKEN: ${{ github.token }}
          HANDOFF_DIR: ${{ runner.temp }}/ibex-hermes-publish/macos-release
          TAG: ${{ needs.identity.outputs.tag }}
        run: |
          python3 -c "$IBEX_RELEASE_SET_VALIDATOR"
          gh release upload "$TAG" "$HANDOFF_DIR/$EXPECTED_NAME" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Upload Windows provenance sidecars
        if: needs.release_state.outputs.need_windows == 'true'
        env:
          EXPECTED_NAME: ${{ needs.windows.outputs.asset_name }}
          EXPECTED_SHA256: ${{ needs.windows.outputs.asset_sha256 }}
          EXPECTED_SIZE: ${{ needs.windows.outputs.asset_size }}
          GH_TOKEN: ${{ github.token }}
          HANDOFF_DIR: ${{ runner.temp }}/ibex-hermes-publish/windows
          TAG: ${{ needs.identity.outputs.tag }}
        run: |
          python3 -c "$IBEX_RELEASE_SET_VALIDATOR"
          gh release upload "$TAG" \
            "$HANDOFF_DIR/$EXPECTED_NAME.sha256" \
            "$HANDOFF_DIR/$EXPECTED_NAME.sigstore.json" \
            "$HANDOFF_DIR/$EXPECTED_NAME.sigstore.json.sha256" \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Upload Windows archive last
        if: needs.release_state.outputs.need_windows == 'true'
        env:
          EXPECTED_NAME: ${{ needs.windows.outputs.asset_name }}
          EXPECTED_SHA256: ${{ needs.windows.outputs.asset_sha256 }}
          EXPECTED_SIZE: ${{ needs.windows.outputs.asset_size }}
          GH_TOKEN: ${{ github.token }}
          HANDOFF_DIR: ${{ runner.temp }}/ibex-hermes-publish/windows
          TAG: ${{ needs.identity.outputs.tag }}
        run: |
          python3 -c "$IBEX_RELEASE_SET_VALIDATOR"
          gh release upload "$TAG" "$HANDOFF_DIR/$EXPECTED_NAME" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Release cross-revision legacy publish lease
        if: ${{ always() && steps.legacy_publish_lock.outputs.acquired == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          IDENTITY: ${{ needs.identity.outputs.identity }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
          TAG: ${{ needs.identity.outputs.tag }}
        run: |
          set -euo pipefail
          [[ "$IDENTITY" =~ ^[0-9a-f]{12}-[0-9a-f]{12}$ ]]
          [[ "$RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TAG" == "hermes-$IDENTITY" ]]
          lock_name="ibex-hermes-legacy-publish-$IDENTITY.lock"
          assets_path="$RUNNER_TEMP/ibex-hermes-release-assets-for-lock-cleanup.json"
          observed_path="$RUNNER_TEMP/ibex-hermes-observed-lock-cleanup.json"
          release_id="$(gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.id')"
          [[ "$release_id" =~ ^[1-9][0-9]*$ ]]
          gh api --paginate --slurp \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" > "$assets_path"
          if ! asset_record="$(LOCK_NAME="$lock_name" python3 -c "$IBEX_LEASE_ASSET_METADATA_VALIDATOR" "$assets_path")"; then
            echo "Legacy publish lease is already absent."
            exit 0
          fi
          read -r asset_id asset_size asset_state asset_decision <<< "$asset_record"
          [[ "$asset_id" =~ ^[1-9][0-9]*$ ]]
          [[ "$asset_size" =~ ^[0-9]+$ ]]
          [[ "$asset_state" =~ ^[^[:space:]]+$ ]]
          if [[ "$asset_decision" != "download" ]]; then
            echo "::warning::legacy publish lease is not a bounded uploaded asset; refusing cleanup download"
            exit 0
          fi
          if ! gh api \
            -H "Accept: application/octet-stream" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" > "$observed_path"; then
            echo "::warning::legacy publish lease could not be downloaded for owner verification"
            exit 0
          fi
          if ! OWNER_RUN_ID="$RUN_ID" OWNER_RUN_ATTEMPT="$RUN_ATTEMPT" python3 - "$observed_path" <<'PY'
          import json
          import os
          import pathlib
          import sys

          def pairs(items):
              result = {}
              for key, value in items:
                  if key in result:
                      raise ValueError(f"duplicate key {key!r}")
                  result[key] = value
              return result

          def reject_constant(value):
              raise ValueError(f"non-finite value {value}")

          try:
              raw = pathlib.Path(sys.argv[1]).read_bytes()
              if not 0 < len(raw) <= 4096:
                  raise ValueError("unsafe lease size")
              text = raw.decode("utf-8", errors="strict")
              document = json.loads(
                  text,
                  object_pairs_hook=pairs,
                  parse_constant=reject_constant,
              )
          except (UnicodeDecodeError, json.JSONDecodeError, ValueError):
              raise SystemExit(1)
          if (not isinstance(document, dict)
                  or set(document) != {"schema", "runId", "runAttempt", "sourceRevision"}
                  or type(document.get("runId")) is not int
                  or type(document.get("runAttempt")) is not int
                  or not isinstance(document.get("sourceRevision"), str)):
              raise SystemExit(1)
          expected = {
              "schema": "ibex/hermes-legacy-publish-lock/1",
              "runId": int(os.environ["OWNER_RUN_ID"]),
              "runAttempt": int(os.environ["OWNER_RUN_ATTEMPT"]),
              "sourceRevision": os.environ["SHA"],
          }
          if document != expected:
              raise SystemExit(1)
          PY
          then
            echo "::warning::legacy publish lease changed owners; refusing to delete asset $asset_id"
            exit 0
          fi
          gh api \
            --method DELETE \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" >/dev/null
          echo "Released legacy publish lease $lock_name"
