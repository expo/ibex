          HANDOFF_DIR: ${{ runner.temp }}/ibex-hermes-publish/portable
          TAG: ${{ needs.identity.outputs.portable_tag }}
        run: |
          python3 -c "$IBEX_RELEASE_SET_VALIDATOR"
