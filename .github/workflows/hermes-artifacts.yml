        with:
          subject-name: ${{ needs.macos_release.outputs.portable_asset_name }}
          subject-digest: sha256:${{ needs.macos_release.outputs.portable_asset_sha256 }}

      - name: Retain exact portable provenance bundle
        if: needs.release_state.outputs.need_portable_macos_release == 'true'
        env:
