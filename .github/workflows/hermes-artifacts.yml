          set -euo pipefail
          [[ "$IDENTITY" =~ ^[0-9a-f]{12}-[0-9a-f]{12}$ ]]
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TAG" == "hermes-portable-$IDENTITY-$SHA" ]]
          title="Hermes portable artifact $SHA"
          notes="One revision-bound diagnostic portable Hermes artifact set for Ibex source revision $SHA. Native compilation runs without release or OIDC credentials; a separate checkout-free publisher validates the current-run raw handoff before attesting its exact name and digest. Detached Sigstore evidence is not yet an admitted portable engine, and acceptance remains disabled pending the LLP 0035 offline verifier and policy. This is an artifact cache, not a product release."
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
