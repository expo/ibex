# @ref LLP 0021#wp10--prove-targets-and-publish-the-conformance-report — run the
# complete documented prerequisite matrix against one exact patched engine and
# retain its artifacts. Until every obligation is executable, CI must prove the
# candidate is incomplete and unadvertised rather than synthesizing promotion.
# @ref LLP 0032#stage-1-bounded-sequential-execution — target jobs expose one
# reviewed outer budget and supervise every conformance child before sharding.
name: CapSec full matrix and evidence

on:
  workflow_dispatch:
  schedule:
    # Weekly, Monday 08:00 UTC (after the patch canary).
    - cron: "0 8 * * 1"
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: capsec-full-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    name: Complete matrix + unadvertised evidence (macOS arm64)
    runs-on: macos-14
    timeout-minutes: 360
    env:
      # download-hermes.sh defaults to the developer/debug profile. This job
      # proves the physical Release target, so bind both artifact selection and
      # the C++ wrapper compile to the no-debugger profile explicitly.
      HERMES_ENABLE_DEBUGGER: "false"
    steps:
      - name: Check out Ibex
        uses: actions/checkout@v4

      - name: Capture outer job budget start
        run: echo "IBEX_CAPSEC_JOB_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.93.1 --profile minimal
          rustup default 1.93.1

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install Node compatibility oracle
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.1

      - name: Bind exact Node compatibility oracle
        run: echo "IBEX_NODE_ORACLE_BIN=$(command -v node)" >> "$GITHUB_ENV"

      - name: Install Java for Android bridge behavior tests
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Python for linked-reference checks
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      # Cache the patched no-debugger framework + host tools. The explicit
      # profile version prevents debugger-enabled reuse, while the hash binds
      # the pin, patch stack, installer, and source-build authorities that
      # issue the framework's provenance receipt.
      - name: Cache patched Hermes artifacts
        id: hermes-cache
        uses: actions/cache@v4
        with:
          path: |
            ios/Frameworks
            tools/hermes
            ~/.cache/exact/hermes
          key: hermes-patched-no-debugger-v2-${{ runner.os }}-${{ hashFiles('scripts/hermes-version.sh', 'scripts/download-hermes.sh', 'scripts/build-hermes.sh', 'scripts/build-hermes-linux.sh', 'scripts/apply-hermes-patches.sh', 'patches/hermes/**') }}

      - name: Build patched Hermes (on cache miss)
        if: steps.hermes-cache.outputs.cache-hit != 'true'
        run: ./scripts/download-hermes.sh
        env:
          # download-hermes.sh verifies the release bundle's workflow-bound
          # provenance, exact source-profile receipt, and no-debugger symbols;
          # a miss or failed validation falls back to the same source builder.
          GH_TOKEN: ${{ github.token }}

      - name: Verify cached Hermes is patched and debugger-free
        run: |
          set -euo pipefail
          binary="ios/Frameworks/hermesvm.framework/Versions/Current/hermesvm"
          test -f "$binary"
          symbols="$(nm -gU "$binary")"
          [[ "$symbols" == *ex_hermes_vm_current_package_id* ]] \
            || { echo "::error::Hermes framework lacks the patched attribution export"; exit 1; }
          if [[ "$symbols" == *AsyncDebuggerAPI* ]]; then
            echo "::error::Hermes framework exports debugger symbols"
            exit 1
          fi

      - name: Run the complete CapSec matrix and bind evidence
        run: >-
          bun run verify:capsec-conformance --
          --target aarch64-apple-darwin
          --expect-incomplete

      # This lane owns the reviewed source-patched profile. The runner first
      # learns the mapped Hermes identity/compiled target from Rust, then
      # authors and executes the matching inherited-intrinsic probe. Its
      # source receipt mechanically binds the mapped factory object's current
      # file bytes to the asserted reviewed fork identity; it does not hash
      # already-mapped executable pages. The ledger remains incomplete for absent
      # Android/Windows executions and for independent origin/record attestation;
      # installer-authored JSON alone is never promotion evidence.
      - name: Prove source-patched inherited intrinsic aliases
        run: >-
          bun packages/ibex-devtools/src/scripts/run-capsec-inherited-intrinsic-alias-conformance.mjs
          --profile source-patched
          --target aarch64-apple-darwin
          --output-dir target/capsec-intrinsic-alias-source-patched

      - name: Retain exact-engine suite and refusal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capsec-evidence-macos-arm64-${{ github.sha }}
          path: |
            target/capsec-ci-status.json
            target/capsec-executions.json
            target/capsec-conformance-report.json
            target/capsec-execution-outcome.json
            target/capsec-live-status.json
            target/capsec-outer-budget.json
            target/capsec-suite-evidence-*/**
            target/capsec-intrinsic-alias-source-patched/**
          if-no-files-found: error
          retention-days: 14

  conformance-windows:
    name: Complete matrix + unadvertised evidence (Windows x64)
    runs-on: windows-2022
    timeout-minutes: 360
    env:
      HERMES_ENABLE_DEBUGGER: "false"
    steps:
      - name: Check out Ibex
        uses: actions/checkout@v4

      - name: Capture outer job budget start
        shell: pwsh
        run: |
          $started = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          "IBEX_CAPSEC_JOB_STARTED_AT=$started" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.93.1 --profile minimal
          rustup default 1.93.1

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install Node compatibility oracle
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.1

      - name: Bind exact Node compatibility oracle
        shell: pwsh
        run: |
          $node = (Get-Command node).Source
          "IBEX_NODE_ORACLE_BIN=$node" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Java for Android bridge behavior tests
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Python for linked-reference checks
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install JS dependencies
        shell: pwsh
        run: bun install --frozen-lockfile

      - name: Test bounded command execution and Windows Job Object cleanup
        shell: pwsh
        run: >-
          bun test
          packages/ibex-devtools/src/scripts/capsec-conformance-plan.test.mjs
          packages/ibex-devtools/src/scripts/capsec-command-evidence.test.mjs

      - name: Cache patched Hermes artifacts
        uses: actions/cache@v4
        with:
          path: |
            tools/hermes/windows-x64
            ~/AppData/Local/Exact/hermes-windows
          key: hermes-patched-no-debugger-v2-${{ runner.os }}-x64-${{ hashFiles('scripts/hermes-version.sh', 'scripts/install-windows-hermes.ps1', 'scripts/build-hermes-windows.ps1', 'scripts/apply-hermes-patches.sh', 'patches/hermes/**') }}

      - name: Install patched no-debugger Release Hermes
        shell: pwsh
        run: ./scripts/install-windows-hermes.ps1 -Arch x64
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Retain Windows engine-profile preflight state
        if: always()
        shell: pwsh
        run: |
          $directory = Join-Path $PWD "target\capsec-workflow-diagnostics\engine-preflight"
          New-Item -ItemType Directory -Force -Path $directory | Out-Null
          @(
            "sourceRevision=${{ github.sha }}"
            "target=x86_64-pc-windows-msvc"
            "stage=windows-engine-profile"
          ) | Set-Content -LiteralPath (Join-Path $directory "status.txt") -Encoding utf8NoBOM

      - name: Verify cached Hermes is patched and debugger-free
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $install = Join-Path $PWD "tools\hermes\windows-x64"
          $dll = Join-Path $install "bin\hermesvm.dll"
          $manifest = Get-Content -LiteralPath (Join-Path $install "artifact.json") -Raw | ConvertFrom-Json
          $builderDigest = (Get-FileHash -Algorithm SHA256 -LiteralPath "scripts\build-hermes-windows.ps1").Hash.ToLowerInvariant()
          $dllDigest = (Get-FileHash -Algorithm SHA256 -LiteralPath $dll).Hash.ToLowerInvariant()
          if ($manifest.configuration -ne "Release" -or
              $manifest.debugger -ne $false -or
              $manifest.architecture -ne "x64" -or
              $manifest.sourceBuildAuthorityDigest -ne $builderDigest -or
              $manifest.binarySha256 -ne $dllDigest) {
            throw "Windows Hermes artifact is not bound to the current no-debugger Release build authority"
          }
          $exports = dumpbin /exports $dll | Out-String
          if ($exports -notmatch 'ex_hermes_vm_current_package_id') {
            throw "Hermes DLL lacks the patched attribution export"
          }
          if ($exports -match 'CDPAgent|CDPDebugAPI') {
            throw "Hermes DLL exports debugger symbols"
          }

      - name: Run the complete CapSec matrix and bind evidence
        shell: pwsh
        run: >-
          bun run verify:capsec-conformance --
          --target x86_64-pc-windows-msvc
          --engine-artifact tools/hermes/windows-x64/bin/hermesvm.dll
          --expect-incomplete

      - name: Retain exact-engine suite and refusal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capsec-evidence-windows-x64-${{ github.sha }}
          path: |
            target/capsec-ci-status.json
            target/capsec-executions.json
            target/capsec-conformance-report.json
            target/capsec-execution-outcome.json
            target/capsec-live-status.json
            target/capsec-outer-budget.json
            target/capsec-workflow-diagnostics/**
            target/capsec-suite-evidence-*/**
          if-no-files-found: error
          retention-days: 14
