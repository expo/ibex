          title="Hermes artifact cache $IDENTITY"
          notes="Prebuilt PATCHED Hermes bundles for platform installers. Native compilation runs without release or OIDC credentials; a separate checkout-free publisher validates each current-run raw handoff before attesting its exact name and digest. Detached Sigstore bundles remain diagnostic evidence only. Revision-bound portable sets use separate prereleases and do not consume this shared legacy asset namespace. This is an artifact cache, not a product release."
