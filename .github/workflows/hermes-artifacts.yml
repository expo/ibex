          EXPECTED_ROLE: windows
          EXPECTED_SHA256: ${{ needs.windows.outputs.asset_sha256 }}
          EXPECTED_SIZE: ${{ needs.windows.outputs.asset_size }}
          HANDOFF_DIR: ${{ runner.temp }}/ibex-hermes-publish/windows
          IBEX_PUBLISH_ROOT: ${{ runner.temp }}/ibex-hermes-publish
        run: |
          python3 -c "$IBEX_PUBLISH_HANDOFF_VALIDATOR"
          python3 -c "$IBEX_RETAIN_SIGSTORE_BUNDLE"

      - name: Ensure revision-scoped portable prerelease exists
        if: needs.release_state.outputs.need_portable_macos_release == 'true'
