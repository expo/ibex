[package]
name = "hermes-lean-sys"
version = "0.1.0"
edition = "2021"
license = "MIT"
links = "hermes_lean"
publish = false

[features]
default = []
# Archive selection is invariant across feature contexts. `link` controls only
# whether this crate emits the selected full VM's native link lines.
link = ["icu"]
# Link the precompiled-bytecode-only VM instead of the full source-capable VM.
# This is mutually exclusive with `link`.
link-lean = ["icu"]
# Linux ICU link lines only. The JSI bindings' Intl shims call ICU directly
# without linking a VM, so `ibex2[bindings]` enables this alone; `link`
# implies it, so ICU is emitted by exactly one crate in any graph.
icu = []

[build-dependencies]
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
ureq = { version = "=3.4.0", default-features = false, features = ["rustls"] }

[dev-dependencies]
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
ureq = { version = "=3.4.0", default-features = false, features = ["rustls"] }
