          EXPECTED_SIZE: ${{ needs.macos_release.outputs.portable_asset_size }}
          HANDOFF_DIR: ${{ runner.temp }}/ibex-hermes-publish/portable
          IBEX_PUBLISH_ROOT: ${{ runner.temp }}/ibex-hermes-publish
        run: |
          python3 -c "$IBEX_PUBLISH_HANDOFF_VALIDATOR"
          python3 -c "$IBEX_RETAIN_SIGSTORE_BUNDLE"

      - name: Attest Windows bundle provenance
        id: attest_windows
        if: needs.release_state.outputs.need_windows == 'true'
