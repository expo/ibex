# @ref LLP 0021#wp10--prove-targets-and-publish-the-conformance-report — run the
# complete documented prerequisite matrix against one exact patched engine and
# retain its artifacts. Until every obligation is executable, CI must prove the
# candidate is incomplete and unadvertised rather than synthesizing promotion.
name: CapSec full matrix and evidence

on:
  workflow_dispatch:
  schedule:
    # Weekly, Monday 08:00 UTC (after the patch canary).
    - cron: "0 8 * * 1"
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: capsec-full-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    name: Complete matrix + unadvertised evidence (macOS arm64)
    runs-on: macos-14
    timeout-minutes: 180
    steps:
      - name: Check out Ibex
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.93.1 --profile minimal
          rustup default 1.93.1

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install Java for Android bridge behavior tests
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      # Cache the built patched framework + host hermesc, keyed on the pin and
      # the patch content. A miss triggers the full Hermes build; a hit reuses
      # the installed artifacts so the run is just cargo build + test.
      - name: Cache patched Hermes artifacts
        id: hermes-cache
        uses: actions/cache@v4
        with:
          path: |
            ios/Frameworks
            tools/hermes
            ~/.cache/exact/hermes
          key: hermes-patched-${{ runner.os }}-${{ hashFiles('scripts/hermes-version.sh', 'patches/hermes/**') }}

      - name: Build patched Hermes (on cache miss)
        if: steps.hermes-cache.outputs.cache-hit != 'true'
        run: ./scripts/download-hermes.sh
        env:
          # download-hermes.sh is download-first (ENG-23147): with a token, gh
          # can fetch the prebuilt patched bundle from this repo's artifact-cache
          # release instead of paying the ~hour source build on a key miss.
          GH_TOKEN: ${{ github.token }}

      - name: Run the complete CapSec matrix and bind evidence
        run: bun run verify:capsec-conformance -- --expect-incomplete

      - name: Retain exact-engine suite and refusal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capsec-evidence-${{ github.sha }}
          path: |
            target/capsec-ci-status.json
            target/capsec-executions.json
            target/capsec-conformance-report.json
            target/capsec-suite-evidence-*/**
          if-no-files-found: error
          retention-days: 14
